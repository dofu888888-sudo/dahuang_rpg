<html lang="zh-Hant">
<head>

<style>
:root{--bg:#0b1016;--panel:#151c24;--panel2:#10161e;--line:#2b3643;--text:#edf1f5;--muted:#9ba8b6;--gold:#d8b56a;--good:#77bf8b;--bad:#dc7b7b;--info:#7eb1df;--rare:#ba9be9}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at top,#182330,#0b1016 45%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif}
button,input,select{font:inherit} button{background:#222d39;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer}button.primary{background:#6c5425;border-color:#9b7937}button.danger{background:#52282a}button:disabled{opacity:.45;cursor:not-allowed}
.app{max-width:1020px;margin:auto;padding:12px}.header{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}.brand h1{font-size:21px;color:var(--gold);margin:0}.muted{color:var(--muted)}
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 10px 30px #0003}.screen{min-height:420px}.title{font-size:24px;color:var(--gold);margin-bottom:5px}.subtitle{color:var(--muted);margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.kv{display:grid;grid-template-columns:90px 1fr;gap:5px 10px;font-size:14px}.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat,.choice,.box{border:1px solid var(--line);border-radius:11px;background:#111923;padding:10px}.stat b{float:right}.choice{margin:9px 0}.choice h4,.box h4{margin:0 0 5px}.choice p,.box p{margin:4px 0;color:#c0cad4;line-height:1.55}.pill{display:inline-block;padding:3px 7px;border:1px solid var(--line);border-radius:999px;margin:2px;font-size:12px}.notice{padding:10px;border-left:3px solid var(--gold);background:#201b12;border-radius:8px;color:#e4d0a3}
.log{max-height:360px;overflow:auto;font-size:13px;line-height:1.55}.entry{padding:6px 0;border-bottom:1px dashed #293440}.good{color:var(--good)}.bad{color:var(--bad)}.info{color:var(--info)}.rare{color:var(--rare)}
.progress{height:9px;background:#242e39;border-radius:99px;overflow:hidden}.progress span{height:100%;display:block;background:linear-gradient(90deg,#846832,#d3af59)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.tabs button.active{border-color:var(--gold);color:var(--gold)}
.map{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.place{border:1px solid var(--line);border-radius:12px;padding:11px;background:#111923}.place.current{border-color:var(--gold)}
.combat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hpbar span{background:linear-gradient(90deg,#7a3232,#cb6464)}.qibar span{background:linear-gradient(90deg,#2e5278,#5a9bd1)}
.small{font-size:12px}.gold{color:var(--gold)}

.compact-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.compact-item{border:1px solid var(--line);background:#111923;border-radius:9px;padding:7px 8px;min-height:64px}
.compact-item h4{font-size:13px;margin:0 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.compact-item p{font-size:11px;margin:2px 0;color:var(--muted)}
.compact-item button{padding:5px 8px;font-size:11px;margin-top:3px}
.market-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.market-item{border:1px solid var(--line);background:#111923;border-radius:10px;padding:9px}
.market-item h4{margin:0 0 4px;font-size:14px}.market-item p{font-size:12px;margin:3px 0;color:#c0cad4}
.combat-overlay{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:18px;z-index:9999}
.combat-overlay.show{display:flex}
.combat-window{width:min(430px,94vw);max-height:86vh;overflow:auto;background:#101821;border:1px solid #445264;border-radius:16px;padding:14px;box-shadow:0 20px 70px #000b}
.arena{display:grid;grid-template-rows:auto 62px auto;gap:10px;align-items:center;margin:8px 0 12px}
.fighter{border:1px solid #39485a;border-radius:11px;background:#121c27;padding:10px}
.fighter.enemy{justify-self:stretch}
.fighter.player{justify-self:stretch}
.fighter-top{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px}
.battle-space{display:flex;align-items:center;justify-content:center;color:#627388;font-size:12px;letter-spacing:.18em}
.combat-actions{display:flex;gap:7px;flex-wrap:wrap}
.combat-actions button{padding:8px 10px;font-size:13px}
.combat-log{font-size:12px;line-height:1.5;max-height:112px;overflow:auto;background:#0d141c;border:1px solid var(--line);border-radius:9px;padding:8px;margin-top:9px}

.info-overlay{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:18px;z-index:10020}
.info-overlay.show{display:flex}
.info-window{width:min(460px,94vw);max-height:84vh;overflow:auto;background:#101821;border:1px solid #445264;border-radius:16px;padding:15px;box-shadow:0 20px 70px #000b}
.slot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{min-height:92px;border:1px dashed #445264;border-radius:11px;padding:9px;background:#0e161f}
.slot b{font-size:12px;color:var(--gold)}.slot p{font-size:12px;margin:5px 0}
.dialogue-choice{display:block;width:100%;text-align:left;margin:7px 0;line-height:1.45}
.family-card{border:1px solid var(--line);border-radius:10px;padding:9px;background:#111923;margin:7px 0}

@media(max-width:680px){.compact-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.market-grid{grid-template-columns:1fr}.combat-window{width:94vw}}

@media(max-width:680px){.stat-grid,.map,.combat-grid{grid-template-columns:1fr}.header{align-items:flex-start}.kv{grid-template-columns:76px 1fr}}
</style>
</head>
<body>
<div class="app">
 <div class="header">
  <div class="brand"><h1>大荒域：凡塵問仙</h1><span class="muted">Alpha 0.6 · 人生世界擴充</span></div>
  <div class="row"><button onclick="saveGame()">儲存</button><button onclick="loadGame()">讀取</button><button class="danger" onclick="newGame()">新局</button></div>
 </div>
 <main class="card">
  <div id="summary"></div>
  <hr style="border-color:var(--line);border-width:1px 0 0;margin:14px 0">

  <hr style="border-color:var(--line);border-width:1px 0 0;margin:18px 0 12px">
  <h3>人生經歷</h3><div id="log" class="log"></div>
 </main>
</div>
<div id="combatOverlay" class="combat-overlay" aria-hidden="true">

</div>

function fresh(){return {
 version:"0.6",phase:"create",name:"無名",gender:null,year:742,month:4,day:1,ageYears:0,ageMonths:0,
 bg:null,bgCost:0,stats:{hp:3,str:3,spd:3,qi:3,wis:3,cha:3},roots:[],traits:[],lifeSkills:[],

}}
function rand(n){return Math.floor(Math.random()*n)}
function pick(a){return a[rand(a.length)]}
function chance(p){return Math.random()<p}
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function addLog(t,c=""){G.events.unshift({t,c,y:G.year,m:G.month,d:G.day,ay:G.ageYears,am:G.ageMonths})}
function advanceDays(n){for(let i=0;i<n;i++){G.day++;if(G.day>30){G.day=1;G.month++;G.ageMonths++;if(G.ageMonths>=12){G.ageMonths=0;G.ageYears++}if(G.month>12){G.month=1;G.year++}}}}
function fmtDate(){return `大曆${G.year}年${G.month}月${G.day}日`}
function fmtAge(){return `${G.ageYears}歲${G.ageMonths?G.ageMonths+"個月":""}`}
function addTrait(x){if(!G.traits.includes(x))G.traits.push(x)}
function addLifeSkill(x){if(!G.lifeSkills.includes(x))G.lifeSkills.push(x)}
function discover(x){if(WORLDS[x]&&!G.discovered.includes(x))G.discovered.push(x)}
function setScreen(x){document.getElementById("screen").innerHTML=x}
function render(){
 summary();logs();
 if(!G.alive){hideCombatModal();return death()}

 else if(G.phase.startsWith("age"))ageUI(+G.phase.slice(3));
 else if(G.phase==="test")testUI();
 else if(G.phase==="route")routeUI();
 else if(G.phase==="world")worldUI(G.flags.lastTab||"travel");
 renderCombatModal();
}

<span class="muted">年代</span><span>${fmtDate()}</span>
<span class="muted">境界</span><span>${G.realm}</span>
<span class="muted">所在地</span><span>${G.place||"未定"}</span>
<span class="muted">靈石</span><span>${G.spiritStones}</span>
</div>
<div class="stat-grid" style="margin-top:10px">${Object.entries(G.stats).map(([k,v])=>`<div class="stat">${STAT_NAMES[k]}<b>${v}</b></div>`).join("")}</div>

function logs(){document.getElementById("log").innerHTML=G.events.slice(0,80).map(e=>`<div class="entry ${e.c}"><span class="muted">大曆${e.y}年${e.m}月${e.d}日 · ${e.ay}歲${e.am?e.am+"個月":""}</span>　${e.t}</div>`).join("")||'<span class="muted">尚無紀錄。</span>'}

function remain(){return 20-G.bgCost-totalStat()-rootCost()}

<h3>出生</h3><div class="row"><button onclick="bg('貧寒之家',0)">貧寒之家</button><button onclick="bg('富貴之家',4)">富貴之家（4）</button></div>

function sd(k,n){let old=G.stats[k];G.stats[k]=clamp(old+n,3,10);if(remain()<0)G.stats[k]=old;render()}
function rt(r){G.roots.includes(r)?G.roots=G.roots.filter(x=>x!==r):G.roots.push(r);if(remain()<0)G.roots=G.roots.filter(x=>x!==r);render()}

 if(c==="brave"){addTrait("勇敢");G.stats.hp++;addLog("你擋在朋友前面，肩上留下傷痕。","good")}

 if(c==="fist"){addLifeSkill("基礎拳腳");G.stats.str++} if(c==="move"){addLifeSkill("基礎身法");G.stats.spd++} if(c==="bow"){addLifeSkill("基礎弓術");G.stats.str++}

 if(c==="family")addTrait("重情"); if(c==="friend")addTrait("重情"); if(c==="village"){addTrait("仁善");G.rep+=2} if(c==="goods")addTrait("務實"); if(c==="flee")addTrait("自保");
 if(c==="save"){G.flags.cultivatorFavor=true;addLog("你救下修士，他留下日後相見的承諾。","rare")}

}

function offers(){G.offers=[];let r=G.roots,s=G.stats;if(r.includes("金")&&(s.spd>=5||s.wis>=5))G.offers.push(["太虛劍宗","劍嶺鎮"]);if((r.includes("木")||r.includes("水")||r.includes("火"))&&s.wis>=5)G.offers.push(["藥王谷","青雲城"]);if((r.includes("火")||r.includes("土")||r.includes("金"))&&(s.qi>=5||s.wis>=6))G.offers.push(["神策府","天機城"]);if((r.includes("土")||r.includes("金"))&&(s.hp>=5||s.str>=5))G.offers.push(["梵天禪院","鳳沙城"]);G.offers.push(["散修","天元城"]);G.phase="route";render()}

/* Main world UI */
function worldUI(tab="travel"){G.flags.lastTab=tab;let p=WORLDS[G.place]||{};setScreen(`
<div class="title">${G.place}</div><div class="subtitle">${p.region||""} · ${p.type||""} · 危險度 ${p.danger??"?"}</div>
<div class="tabs">
<button class="${tab==="travel"?"active":""}" onclick="worldUI('travel')">遊歷</button>
<button class="${tab==="quest"?"active":""}" onclick="worldUI('quest')">任務</button>
<button class="${tab==="explore"?"active":""}" onclick="worldUI('explore')">探索</button>
<button class="${tab==="people"?"active":""}" onclick="worldUI('people')">夥伴／伴侶</button>
<button class="${tab==="skill"?"active":""}" onclick="worldUI('skill')">技能</button>
<button class="${tab==="city"?"active":""}" onclick="worldUI('city')">當地行動</button>
<button class="${tab==="cult"?"active":""}" onclick="worldUI('cult')">修煉</button>
<button class="${tab==="bag"?"active":""}" onclick="worldUI('bag')">背包</button>
</div><div id="tabbody"></div>`);
let b=document.getElementById("tabbody");
if(tab==="travel")travelTab(b);
if(tab==="quest")questTab(b);
if(tab==="explore")exploreTab(b);
if(tab==="people")peopleTab(b);
if(tab==="skill")skillTab(b);
if(tab==="city")cityTab(b);
if(tab==="cult")cultTab(b);

function travelTab(b){
 let direct=ROUTES[G.place]||{};
 let options=Object.entries(direct).filter(([x])=>G.discovered.includes(x));
 let hubs=["天元城","青雲城","天機城","劍嶺鎮","鳳沙城","望月城"].filter(x=>x!==G.place&&G.discovered.includes(x)&&!direct[x]);
 b.innerHTML=`<div class="notice">你可以沿附近道路移動，也可安排長途遠行。旅途中可能連續遭遇事件。</div>
<h3>附近道路</h3>${options.map(([to,d])=>travelCard(to,d)).join("")||"<p class='muted'>沒有已知道路。</p>"}
<h3>長途遠行</h3>${hubs.map(to=>travelCard(to,longTripDays(to),true)).join("")||"<p class='muted'>尚未掌握其他大城方向。</p>"}`;
}
function travelCard(to,d,long=false){let days=long?d:travelDays(d);return `<div class="choice"><h4>${to}</h4><p>${WORLDS[to].region} · ${WORLDS[to].type}　預估 ${days} 日${long?"（長途）":""}</p><button onclick="${long?`longTravel('${to}',${days})`:`travel('${to}',${d})`}">出發</button></div>`}
function longTripDays(to){let reg=WORLDS[to]?.region||"";return 12+rand(7)+(reg===WORLDS[G.place]?.region?0:6)}
function travelDays(base){return Math.max(1,Math.round(base*(1.25-G.stats.spd*.035)))}
function travel(to,base){doTravel(to,travelDays(base))}
function longTravel(to,days){doTravel(to,days)}
function doTravel(to,days){
 if(G.combat||G.pendingTravel)return;
 let from=G.place,segments=Math.max(1,Math.floor(days/5));
 G.pendingTravel={from,to,days};
 advanceDays(days);
 for(let i=0;i<segments;i++){
   if(chance(.38)){
     let combatStarted=travelEncounter(from,to);
     if(combatStarted){render();return}
   }
 }
 finishTravel();
}
function finishTravel(){
 let p=G.pendingTravel;if(!p)return;
 G.place=p.to;discover(p.to);
 for(const x of Object.keys(ROUTES[p.to]||{}))if(chance(.75))discover(x);
 addLog(`你從${p.from}抵達${p.to}，共行${p.days}日。`,"info");
 G.pendingTravel=null;render()
}
function travelEncounter(from,to){
 let r=Math.random();
 if(r<.22){
   let d=Math.max(1,Math.round(((WORLDS[from]?.danger||0)+(WORLDS[to]?.danger||0))/2));
   startCombat(randomEnemy(d),"travel");
   return true
 }
 if(r<.42){let who=pick(NPC_TEMPLATES);addLog(`旅途中遇見${who.name}（${who.style}），短暫同行後彼此留下印象。`,"info");if(chance(.32))recruitNPC(who)}
 else if(r<.57){let q=createClueQuest(from,to);addQuest(q);addLog(`你在途中得到一條線索，已加入任務「${q.title}」。`,"rare")}
 else if(r<.68){let s=rand(6)+2;G.spiritStones+=s;addLog(`你幫助一支商隊處理麻煩，得到${s}枚下品靈石。`,"good")}
 else addLog("這一段旅途平靜無事，只有山川與風聲陪伴你。")
 return false
}

/* Quest system */
function addQuest(q){if(!G.quests.some(x=>x.id===q.id))G.quests.push(q)}
function createClueQuest(a,b){
 let pool=[
  {title:"石壁後的回音",type:"ruin",place:b,desc:"戰鬥痕跡指向一處被人刻意遮掩的石壁。"},
  {title:"失蹤採藥人的腳印",type:"beast",place:b,desc:"腳印一路延伸進危險山林，途中混著獸爪痕跡。"},
  {title:"黑袍人的行蹤",type:"demonic",place:b,desc:"有人看見黑袍修士拖著染血布袋往荒野深處走。"},
  {title:"殘缺藏寶圖",type:"treasure",place:b,desc:"一張殘圖標示著附近某處古老地窟。"}
 ]; let x=structuredClone(pick(pool));x.id="q"+Date.now()+rand(99999);x.status="active";x.source="探索線索";return x
}
function questTab(b){
 let active=G.quests.filter(q=>q.status==="active"),done=G.quests.filter(q=>q.status==="done");
 b.innerHTML=`<div class="notice">探索得到的「線索」不再放進背包，而是自動形成可追查的任務。</div>
<h3>進行中</h3>${active.map(q=>`<div class="choice"><h4>${q.title}</h4><p>${q.desc}</p><p>目標地：${q.place}　來源：${q.source}</p><button ${G.place===q.place?"":"disabled"} onclick="resolveQuest('${q.id}')">${G.place===q.place?"追查線索":"需前往"+q.place}</button></div>`).join("")||"<p class='muted'>目前沒有進行中的任務。</p>"}
<h3>已完成</h3>${done.slice(-8).reverse().map(q=>`<div class="box"><h4>${q.title}</h4><p>${q.result||"已完成"}</p></div>`).join("")||"<p class='muted'>尚無。</p>"}`;
}
function resolveQuest(id){
 let q=G.quests.find(x=>x.id===id);if(!q)return;advanceDays(rand(4)+2);
 let d=WORLDS[G.place]?.danger||1;
 if(q.type==="beast"){G.flags.questCombat=id;startCombat(randomEnemy(Math.max(1,d)),"quest");return}
 if(q.type==="demonic"){G.flags.questCombat=id;startCombat({name:"黑袍魔修",level:d+2,maxHp:52+d*12,atk:9+d*4,spd:6+d*2,reward:12+d*7,type:"魔修"},"quest");return}
 if(q.type==="ruin"&&chance(.55)){G.flags.questCombat=id;startCombat(randomEnemy(Math.max(1,d+1)),"quest");return}
 finishQuest(q)
}
function finishQuest(q){
 q.status="done";let r=Math.random();let result="";
 if(r<.24){let t=randomTreasure();G.treasures.push(t);result=`得到寶物「${t.name}」（${t.buff}）。`;addLog(`完成任務「${q.title}」，${result}`,"rare")}
 else if(r<.45){let w=randomWeapon();G.inventory.push(w);result=`得到武器「${w.name}」，攻擊+${w.atk}。`;addLog(`完成任務「${q.title}」，${result}`,"rare")}
 else if(r<.62){let book=pick(Object.keys(SKILLS).filter(x=>!G.learnedSkills.includes(x)));if(book){G.skillBooks.push(book);result=`得到技能書《${book}》。`;addLog(`完成任務「${q.title}」，${result}`,"rare")}else{G.spiritStones+=20;result="得到20枚下品靈石。"}}
 else if(r<.79){let title=randomTitle();if(!G.titles.some(t=>t.name===title.name))G.titles.push(title);result=`獲得稱號【${title.name}】：${title.buff}`;addLog(result,"rare")}
 else if(r<.92){let who=structuredClone(pick(NPC_TEMPLATES));recruitNPC(who,true);result=`結識並招募${who.name}成為旅行夥伴。`}
 else {G.spiritStones+=rand(21)+15;result="得到一批靈石與材料。";addLog(`完成任務「${q.title}」，${result}`,"good")}
 q.result=result;render()
}
function randomTreasure(){return pick([{name:"凝神玉佩",buff:"悟性相關判定略微提高",stat:"wis",v:1},{name:"青木護心鏡",buff:"最大生命+10",hp:10},{name:"踏雲靴",buff:"逃跑成功率+8%",escape:.08},{name:"聚靈珠",buff:"修煉效率+8%",cult:.08}])}
function randomWeapon(){return pick([{name:"玄鐵長劍",type:"weapon",atk:7},{name:"赤紋刀",type:"weapon",atk:8},{name:"青鋒靈劍",type:"weapon",atk:10},{name:"破邪槍",type:"weapon",atk:9}])}
function randomTitle(){return pick([{name:"荒野行者",buff:"旅行逃跑率+5%",escape:.05,source:"在荒野與道路間累積足夠遊歷經驗後獲得。"},{name:"獵妖新秀",buff:"對魔獸傷害+5%",beast:.05,source:"完成獵妖相關探索任務時獲得。"},{name:"破邪之人",buff:"對魔修傷害+5%",demon:.05,source:"完成對抗魔修的任務時獲得。"},{name:"尋寶客",buff:"任務獎勵品質略微提升",loot:.05,source:"多次追查寶藏線索後獲得。"}])}

/* Explore */
function exploreTab(b){let ex=G.explored[G.place]||0;b.innerHTML=`<h3>探索度：${ex}%</h3><div class="progress"><span style="width:${ex}%"></span></div><p class="muted">探索可能形成任務、遭遇敵人、認識NPC或發現新道路。</p><button class="primary" onclick="explore()">探索附近</button>`}
function explore(){
 let p=WORLDS[G.place],d=p?.danger||0,days=rand(5)+2;advanceDays(days);G.explored[G.place]=clamp((G.explored[G.place]||0)+rand(9)+6+Math.floor(G.stats.wis/3),0,100);
 let r=Math.random();
 if(r<.28){let q=createClueQuest(G.place,G.place);addQuest(q);addLog(`探索時發現新線索，任務「${q.title}」已加入任務列表。`,"rare")}
 else if(r<.48&&d>0){startCombat(randomEnemy(d),"explore");return}
 else if(r<.68){let who=structuredClone(pick(NPC_TEMPLATES));addLog(`你在${G.place}遇見${who.name}（${who.style}）。`,"info");if(chance(.4))recruitNPC(who)}
 else if(r<.84){let s=rand(10)+4;G.spiritStones+=s;addLog(`你採集到一批材料，出售後得到${s}枚下品靈石。`,"good")}
 else {let roads=Object.keys(ROUTES[G.place]||{}).filter(x=>!G.discovered.includes(x));if(roads.length){let n=pick(roads);discover(n);addLog(`你找到一條通往「${n}」的新路。`,"rare")}else addLog("你繞行數日，沒有特別發現。")}

}
function peopleTab(b){

${G.partner?`<div class="choice"><h4>道侶：${G.partner}</h4><p>性別：${(G.companions.find(x=>x.name===G.partner)||{}).gender||"未知"}｜你們已確認彼此的感情。</p></div>`:""}
${list.map((n,i)=>`<div class="choice"><h4>${n.name} · ${n.status}${G.activeCompanion===n.name?"（上場）":""}</h4><p>性別：${n.gender||"未知"}｜${n.style}｜${n.personality}｜好感 ${n.aff}｜信任 ${n.trust}</p><div class="row"><button onclick="chatNPC(${i})">閒聊</button><button onclick="giftNPC(${i})">贈與物品</button><button onclick="setActive(${i})">設為上場夥伴</button>${n.romance&&n.aff>=85&&n.trust>=75&&!G.partner?`<button onclick="confess(${i})">表明心意</button>`:""}</div></div>`).join("")||"<p class='muted'>尚無旅行夥伴。透過遊歷、探索與任務可能結識他們。</p>"}`;
}
function chatNPC(i){
 let n=G.companions[i];advanceDays(1);let gain=rand(4)+1;n.aff=clamp(n.aff+gain,0,100);n.trust=clamp(n.trust+rand(3),0,100);
 addLog(`你與${n.name}閒聊了一陣，好感+${gain}。`,"info");
 if(!n.storyTriggered&&n.aff>=50&&chance(.45)){
  n.storyTriggered=true;let q={id:"npc"+Date.now()+rand(9999),title:`${n.name}的故鄉`,type:"npcstory",place:n.home,desc:`閒聊時，${n.name}提起故鄉${n.home}的一段往事，希望你有朝一日能陪其回去看看。`,status:"active",source:`與${n.name}閒聊`,npc:n.name};addQuest(q);addLog(`${n.name}向你透露了家鄉往事，特殊任務「${q.title}」開啟。`,"rare")
 }
 checkFriend(n);render()
}
function giftNPC(i){
 let n=G.companions[i];let affordable=GIFTS.filter(g=>g.price<=G.spiritStones);if(!affordable.length){alert("你沒有足夠靈石購買合適的贈禮。");return}
 let g=pick(affordable);G.spiritStones-=g.price;let bonus=g.aff+(G.stats.cha>=7?2:0);n.aff=clamp(n.aff+bonus,0,100);addLog(`你送給${n.name}「${g.name}」，好感+${bonus}。`,"good");checkFriend(n);render()
}
function checkFriend(n){if(n.aff>=80&&n.trust>=70&&n.status!=="摯友"){n.status="摯友";addLog(`${n.name}已將你視為摯友。其上場時，你的總戰力提高5%。`,"rare")}}
function setActive(i){G.activeCompanion=G.companions[i].name;addLog(`${G.activeCompanion}成為你的上場夥伴。`,"info");render()}

/* Skills / inventory */
function skillTab(b){
 b.innerHTML=`<h3>已習得技能</h3>${G.learnedSkills.map(s=>`<div class="box"><h4>${s}</h4><p>${SKILLS[s].desc}　耗氣 ${SKILLS[s].qi}</p></div>`).join("")||"<p class='muted'>尚未學會術法。</p>"}
<h3>技能書</h3>${G.skillBooks.map((s,i)=>`<div class="choice"><h4>《${s}》</h4><p>${SKILLS[s]?.desc||""}</p><button onclick="learnSkill(${i})">研習</button></div>`).join("")||"<p class='muted'>沒有未研習的技能書。</p>"}`;

function learnSkill(i){let s=G.skillBooks[i];if(!s)return;if(!G.learnedSkills.includes(s))G.learnedSkills.push(s);G.skillBooks.splice(i,1);advanceDays(2);addLog(`你研習技能書，學會「${s}」。`,"good");render()}
function compactInventoryEntries(){
 let map=new Map();

/* City / cultivate */
function hasMarket(place=G.place){
 let t=WORLDS[place]?.type||"";
 return ["巨城","城鎮","港城","邊城","修士城","大城","島城","要塞"].includes(t)
}
function marketStock(place=G.place){
 if(!G.marketCache)G.marketCache={};
 if(!G.marketCache[place]){
   let seed=[...MARKET_CATALOG];
   let fixed=seed.filter(x=>["低階療傷丹","回氣丹","辟穀丹"].includes(x.name));
   let extras=seed.filter(x=>!fixed.includes(x)).sort(()=>Math.random()-.5).slice(0,5);
   G.marketCache[place]=[...fixed,...extras];
 }
 return G.marketCache[place]
}
function itemSellPrice(x){
 if(x.price)return Math.max(1,Math.floor(x.price*.55));
 if(x.type==="weapon")return Math.max(2,(x.atk||1)*4);
 if(x.type==="consumable")return 3;
 return 1
}
function cityTab(b){
 b.innerHTML=`<div class="row">${hasMarket()?`<button class="primary" onclick="openMarket()">商場市集</button>`:""}<button onclick="localAction('inn')">酒樓打聽消息</button><button onclick="localAction('notice')">查看懸賞／委託</button>${G.sect&&G.place===sectPlace()?`<button onclick="localAction('sect')">宗門事務</button>`:""}</div>${hasMarket()?"<p class='muted small'>此地有固定市集，可使用下品靈石買賣物品。</p>":"<p class='muted'>此處並非城鎮，沒有固定市集。</p>"}`
}
function openMarket(mode="buy"){
 let b=document.getElementById("tabbody");if(!b)return;
 let stock=marketStock();
 let sell=compactInventoryEntries().filter(g=>g.item.name!=="布衣");
 b.innerHTML=`<div class="row"><button class="${mode==="buy"?"primary":""}" onclick="openMarket('buy')">購買</button><button class="${mode==="sell"?"primary":""}" onclick="openMarket('sell')">出售</button><button onclick="worldUI('city')">返回</button><span class="pill">靈石 ${G.spiritStones}</span></div>
 ${mode==="buy"?`<div class="market-grid" style="margin-top:10px">${stock.map((x,i)=>`<div class="market-item"><h4>${x.type==="skillbook"?"《"+x.name+"》":x.name}</h4><p>${x.desc||""}</p><p class="gold">${x.price} 靈石</p><button ${G.spiritStones<x.price?"disabled":""} onclick="buyMarket(${i})">購買</button></div>`).join("")}</div>`:
 `<div class="market-grid" style="margin-top:10px">${sell.map(g=>`<div class="market-item"><h4>${g.item.name}${g.count>1?" ×"+g.count:""}</h4><p>商家收購價：${itemSellPrice(g.item)} 靈石</p><button onclick="sellMarket(${g.index})">出售 1 件</button></div>`).join("")||"<p class='muted'>目前沒有可出售物品。</p>"}</div>`}`
}
function buyMarket(i){
 let x=marketStock()[i];if(!x||G.spiritStones<x.price)return;
 G.spiritStones-=x.price;
 if(x.type==="skillbook")G.skillBooks.push(x.name);
 else G.inventory.push(structuredClone(x));
 addLog(`你在${G.place}市集花${x.price}靈石購買「${x.name}」。`,"info");
 summary();openMarket("buy");logs()
}
function sellMarket(i){
 let x=G.inventory[i];if(!x)return;
 if(G.equippedWeapon===x){G.equippedWeapon={name:"徒手",atk:0}}
 let price=itemSellPrice(x);G.spiritStones+=price;G.inventory.splice(i,1);
 addLog(`你在${G.place}市集出售「${x.name}」，得到${price}靈石。`,"good");
 summary();openMarket("sell");logs()
}

 if(x==="notice"){advanceDays(1);let q=createClueQuest(G.place,G.place);q.source="城鎮委託";addQuest(q);addLog(`你接下委託「${q.title}」。`,"info")}

function cultTab(b){b.innerHTML=`<h3>${G.realm}</h3><p>修為 ${G.cult}/100</p><div class="progress"><span style="width:${Math.min(100,G.cult)}%"></span></div><p>閉關只是人生中的一種選擇。</p><div class="row"><button onclick="cultivate(10)">打坐十日</button><button onclick="cultivate(30)">閉關一月</button><button onclick="cultivate(90)">閉關三月</button></div>`}
function cultivate(days){advanceDays(days);let mult=G.roots.length===1?1.35:G.roots.length===2?1.15:G.roots.length===3?1:.82;let tbonus=1+G.treasures.reduce((a,t)=>a+(t.cult||0),0);let gain=Math.max(1,Math.round((G.stats.qi+G.stats.wis/2)*mult*tbonus*days/28));G.cult+=gain;addLog(`修煉${days}日，修為增加${gain}。`);while(G.cult>=100&&G.realm!=="煉氣大圓滿"){G.cult-=100;let a=["一","二","三","四","五","六","七","八","九"],m=G.realm.match(/煉氣(.)層/);if(m){let i=a.indexOf(m[1]);if(i<8){G.realm=`煉氣${a[i+1]}層`;addLog(`突破至${G.realm}！`,"good")}else{G.realm="煉氣大圓滿";G.cult=100}}}render()}

/* Combat */
function playerMaxHP(){let bonus=G.treasures.reduce((a,t)=>a+(t.hp||0),0);return 55+G.stats.hp*8+bonus}
function playerMaxQI(){return 30+G.stats.qi*10}
function combatPowerBuff(enemy){
 let b=1;
 let n=G.companions.find(x=>x.name===G.activeCompanion);if(n&&n.status==="摯友")b+=.05;
 if(n&&n.status==="道侶")b+=.07;
 for(const t of G.titles){if(enemy.type==="魔獸")b+=t.beast||0;if(enemy.type==="魔修")b+=t.demon||0}
 return b
}
function randomEnemy(d){
 let names=d>=4?["血眼魔狼","腐骨巨蟒","幽冥鬼猿"]:d>=2?["鐵背妖狼","赤尾妖狐","毒牙巨蜥"]:["野化靈狼","山魈","低階妖蛇"];
 return {name:pick(names),level:d,maxHp:35+d*15,atk:7+d*4,spd:5+d*2,reward:5+d*6,type:"魔獸"}
}
function startCombat(enemy,source){
 if(G.combat)return false;
 G.combat={enemy,source,pHP:playerMaxHP(),pQI:playerMaxQI(),eHP:enemy.maxHp,guardEscape:0,turn:1,busy:false,log:[`遭遇${enemy.name}！`]};
 renderCombatModal();
 return true
}
function hideCombatModal(){
 let o=document.getElementById("combatOverlay");if(o){o.classList.remove("show");o.setAttribute("aria-hidden","true")}
}
function renderCombatModal(){
 let o=document.getElementById("combatOverlay"),w=document.getElementById("combatWindow");
 if(!o||!w)return;
 if(!G.combat){hideCombatModal();return}
 let c=G.combat,e=c.enemy;
 o.classList.add("show");o.setAttribute("aria-hidden","false");
 w.innerHTML=`<div class="row" style="justify-content:space-between"><b class="gold">戰鬥</b><span class="muted small">第 ${c.turn} 回合</span></div>
 <div class="arena">
   <div class="fighter enemy">
     <div class="fighter-top"><b>⬛ ${e.name}</b><span>${e.type} · 威脅${e.level}</span></div>
     <p class="small">生命 ${Math.max(0,c.eHP)}/${e.maxHp}</p>
     <div class="progress hpbar"><span style="width:${clamp(c.eHP/e.maxHp*100,0,100)}%"></span></div>
   </div>
   <div class="battle-space">─── 對 戰 ───</div>
   <div class="fighter player">
     <div class="fighter-top"><b>⬜ ${G.name}</b><span>${G.activeCompanion?`同行：${G.activeCompanion}`:"獨行"}</span></div>
     <p class="small">生命 ${Math.max(0,c.pHP)}/${playerMaxHP()}　｜　靈氣 ${Math.max(0,c.pQI)}/${playerMaxQI()}</p>
     <div class="progress hpbar"><span style="width:${clamp(c.pHP/playerMaxHP()*100,0,100)}%"></span></div>
     <div class="progress qibar" style="margin-top:5px"><span style="width:${clamp(c.pQI/playerMaxQI()*100,0,100)}%"></span></div>
   </div>
 </div>
 <div class="combat-actions">
   <button class="primary" ${c.busy?"disabled":""} onclick="combatAction('attack')">一般攻擊</button>
   ${G.learnedSkills.map(s=>`<button ${c.busy||c.pQI<SKILLS[s].qi?"disabled":""} onclick="combatSkill('${s}')">${s}（${SKILLS[s].qi}氣）</button>`).join("")}
   <button ${c.busy?"disabled":""} onclick="combatAction('escape')">逃跑</button>
 </div>
 <div class="combat-log">${c.log.slice(-7).map(x=>`<div>${x}</div>`).join("")}</div>`
}
function combatAction(a){
 let c=G.combat;if(!c||c.busy)return;let e=c.enemy;c.busy=true;
 if(a==="attack"){
   let dmg=Math.round((5+G.stats.str*2+(G.equippedWeapon?.atk||0))*combatPowerBuff(e)*(0.85+Math.random()*.3));
   c.eHP-=dmg;c.log.push(`你一般攻擊，造成 ${dmg} 傷害。`);
   if(c.eHP<=0){c.busy=false;return winCombat()}
 }
 if(a==="escape"){
   let base=.62+(G.stats.spd-e.spd)*.045+c.guardEscape+G.treasures.reduce((a,t)=>a+(t.escape||0),0)+G.titles.reduce((a,t)=>a+(t.escape||0),0);
   if(chance(clamp(base,.08,.92))){
     addLog(`你成功從${e.name}手中逃走。`,"info");
     let source=c.source;G.combat=null;hideCombatModal();
     if(source==="travel"&&G.pendingTravel)return finishTravel();
     render();return
   }else c.log.push("逃跑失敗！")
 }
 c.busy=false;enemyTurn()
}
function combatSkill(s){
 let c=G.combat;if(!c||c.busy)return;let e=c.enemy,sk=SKILLS[s];if(!sk||c.pQI<sk.qi)return;c.busy=true;c.pQI-=sk.qi;
 if(sk.utility==="heal"){let heal=-sk.power+Math.floor(G.stats.qi*.6);c.pHP=clamp(c.pHP+heal,0,playerMaxHP());c.log.push(`你施展${s}，恢復 ${heal} 生命。`)}
 else if(sk.utility==="escape"){c.guardEscape+=.22;c.log.push(`你施展${s}，本場逃跑機率提高。`)}
 else{
   let dmg=Math.round((sk.power+G.stats.qi*1.4+G.stats.wis*.5)*combatPowerBuff(e)*(0.88+Math.random()*.25));
   c.eHP-=dmg;c.log.push(`你施展${s}，造成 ${dmg} 傷害。`);
   if(c.eHP<=0){c.busy=false;return winCombat()}
 }
 c.busy=false;enemyTurn()
}
function enemyTurn(){
 let c=G.combat;if(!c)return;let e=c.enemy;let dodge=clamp(.05+(G.stats.spd-e.spd)*.025,0,.35);
 if(chance(dodge))c.log.push(`你閃過${e.name}的攻擊。`);
 else{let dmg=Math.max(1,Math.round(e.atk*(.85+Math.random()*.3)-G.stats.hp*.5));c.pHP-=dmg;c.log.push(`${e.name}反擊，造成 ${dmg} 傷害。`)}
 if(c.pHP<=0){let eName=e.name;G.combat=null;hideCombatModal();die(`你在與${eName}的戰鬥中身亡。`);return}
 c.turn++;renderCombatModal()
}
function winCombat(){
 let c=G.combat;if(!c)return;let e=c.enemy;let reward=e.reward+rand(6);G.spiritStones+=reward;
 addLog(`你擊敗${e.name}，得到價值${reward}靈石的戰利品。`,"good");
 let source=c.source;G.combat=null;hideCombatModal();
 if(source==="quest"&&G.flags.questCombat){
   let q=G.quests.find(x=>x.id===G.flags.questCombat);delete G.flags.questCombat;
   if(q){if(q.type==="npcstory")finishNpcStory(q);else finishQuest(q);return}
 }
 if(chance(.14)){
   let title=e.type==="魔修"?{name:"初斬邪修",buff:"對魔修傷害+5%",demon:.05}:{name:"初獵妖獸",buff:"對魔獸傷害+5%",beast:.05};
   if(!G.titles.some(t=>t.name===title.name)){G.titles.push(title);addLog(`你獲得稱號【${title.name}】：${title.buff}`,"rare")}
 }
 if(source==="travel"&&G.pendingTravel)return finishTravel();
 render()
}

/* Override npcstory quest handling */
const _resolveQuest = resolveQuest;
resolveQuest = function(id){
 let q=G.quests.find(x=>x.id===id);if(!q)return;
 if(q.type==="npcstory"){
   advanceDays(rand(3)+2);
   if(chance(.6)){G.flags.questCombat=id;startCombat(randomEnemy(Math.max(1,WORLDS[G.place]?.danger||1)),"quest");return}
   finishNpcStory(q);render();return
 }
 _resolveQuest(id)
}

function showTitleInfo(i){let t=G.titles[i];if(!t)return;showInfo(`稱號【${t.name}】`,`<p><b>來源：</b>${t.source||titleSource(t.name)}</p><p><b>效果：</b>${t.buff||"特殊經歷稱號"}</p>`)}
function titleSource(name){
 const map={"初斬邪修":"首次擊敗危險魔修時獲得。","初獵妖獸":"首次獵殺具有威脅的魔獸時獲得。","荒野行者":"長期在荒野與道路間遊歷的證明。","獵妖新秀":"完成獵妖相關任務時獲得。","破邪之人":"完成對抗魔修的任務時獲得。","尋寶客":"多次追查寶物線索後獲得。"};
 return map[name]||"由一次特殊經歷或隱藏條件觸發。"
}
function showItemInfo(i){let x=G.inventory[i];if(!x)return;let lines=[];if(x.atk)lines.push(`攻擊 +${x.atk}`);if(x.def)lines.push(`防禦 +${x.def}`);if(x.hp)lines.push(`生命 +${x.hp}`);if(x.spd)lines.push(`速度 +${x.spd}`);showInfo(x.name,`<p>類型：${x.type||"物品"}</p><p>${lines.join("<br>")||x.desc||"沒有額外屬性。"}</p>`)}

function advanceDays(n){
 for(let i=0;i<n;i++){
   G.day++;
   if(G.playerPregnancy){G.playerPregnancy.days--;if(!G.playerPregnancy.known&&G.playerPregnancy.days<=240){G.playerPregnancy.known=true;addLog("你察覺身體出現變化，確認已有身孕。","rare")}if(G.playerPregnancy.days<=0)giveBirth("player")}
   for(const npc of G.companions){if(npc.pregnancy){npc.pregnancy.days--;if(!npc.pregnancy.known&&npc.pregnancy.days<=240){npc.pregnancy.known=true;addLog(`${npc.name}告訴你，她已有身孕。`,"rare")}if(npc.pregnancy.days<=0)giveBirth(npc.name)}}
   if(G.day>30){
     G.day=1;G.month++;G.ageMonths++;
     if(G.ageMonths>=12){G.ageMonths=0;G.ageYears++}
     npcMonthTick();
     if(G.month>12){G.month=1;G.year++;npcYearTick()}
   }
 }
}
function npcMonthTick(){
 for(const n of G.companions){
   n.ageMonths=(n.ageMonths||0)+1;if(n.ageMonths>=12){n.ageMonths=0;n.ageYears=(n.ageYears||18)+1}
   if(chance(.06))npcRandomEvent(n)
 }
 for(const c of G.children){
   c.ageMonths=(c.ageMonths||0)+1;if(c.ageMonths>=12){c.ageMonths=0;c.ageYears++;if(c.ageYears===16){c.career=pick(["學徒","商行伙計","武館學徒","藥鋪學徒","散修學徒"]);addLog(`${c.name}年滿16歲，開始以「${c.career}」身分摸索自己的人生。`,"info")}}
   if(chance(.035))childRandomEvent(c)
 }
}
function npcYearTick(){
 for(const n of G.companions){
   if(chance(.18)){
     let old=n.career;
     if(CAREERS[old]?.kind==="平民")n.career=pick(["商人","藥師","鐵匠","酒樓掌櫃","護衛"]);
     else if(CAREERS[old]?.kind==="修士")n.career=pick(["散修","劍修","醫修","符修","獵妖人"]);
     if(old!==n.career){n.combatCapable=!!CAREERS[n.career]?.combat;addLog(`${n.name}的人生發生變化，職業從「${old}」變成「${n.career}」。`,"info")}
   }
 }
}
function npcRandomEvent(n){
 let ev=pick(["接到一筆臨時工作","與舊識重逢","受了輕傷","賺到一筆錢","得罪了地方人物","幫助一名陌生人","突然想起故鄉","收到家書","修為有所精進","開始學習新的手藝"]);
 addLog(`【${n.name}】${ev}。`,"info");
 if(ev==="受了輕傷")n.trust=clamp(n.trust-1,0,100);
 if(ev==="幫助一名陌生人")n.aff=clamp(n.aff+1,0,100)
}
function childRandomEvent(c){addLog(`【${c.name}】${pick(["在私塾交到新朋友","跟鄰家孩子打了一架","開始對父母的冒險故事感到好奇","生了一場小病後康復","迷上了一門手藝","第一次偷偷跑去市集"])}。`,"info")}

/* Sect examination: one attempt per calendar year */
function sectTab(b){
 let rows=Object.entries(SECTS).map(([name,s])=>{
   let at=G.place===s.place,used=G.flags.sectExamYear===G.year,member=G.sect===name;
   return `<div class="choice"><h4>${name}${member?"（現宗門）":""}</h4><p>${s.desc}</p><p>考核地：${s.place}</p><button ${!at||used||member?"disabled":""} onclick="takeSectExam('${name}')">${member?"已是門人":used?"今年已參加過考核":at?"參加本年度考核":"需前往"+s.place}</button></div>`
 }).join("");
 b.innerHTML=`<div class="notice">散修也能先闖蕩天下，再決定投身宗門。每個曆年只能參加一次宗門入門考核。</div>${rows}`
}
function takeSectExam(name){
 if(G.flags.sectExamYear===G.year)return;let s=SECTS[name];if(!s||G.place!==s.place)return;
 G.flags.sectExamYear=G.year;advanceDays(3);
 let rootScore=G.roots.some(r=>s.root.includes(r))?18:4;
 let statScore=s.focus.reduce((a,k)=>a+G.stats[k]*5,0);
 let lifeScore=G.rep*2+(G.titles.length*2)+(G.lifeSkills.length);
 let roll=rand(45);let score=rootScore+statScore+lifeScore+roll;
 if(score>=76){G.sect=name;G.spiritStones+=15;addLog(`你通過${name}本年度入門考核，正式成為門人。`,"rare")}
 else addLog(`你參加${name}考核，但此次未被錄取。下一個曆年仍可再試。`,"bad");
 render()
}

/* Background-aware NPC generation */
function careerForPlace(place){
 let t=WORLDS[place]?.type,reg=WORLDS[place]?.region;
 let pool=t==="海域"||reg==="東海"?["漁民","商人","散修","護衛"]:
          t==="宗門"?["散修","劍修","醫修","符修","護衛"]:
          t==="野外"||t==="禁地"||t==="魔域"?["散修","獵妖人","採藥人","護衛"]:
          ["商人","藥師","鐵匠","書生","護衛","散修","酒樓掌櫃"];
 return pick(pool)
}
function generateNPC(place=G.place){
 let base=structuredClone(pick(NPC_TEMPLATES)),career=careerForPlace(place),age=16+rand(21);
 let trait=pick(["勇敢","謹慎","好奇","重情","冷靜","膽小","豪爽","固執"]);
 let roots=CAREERS[career]?.combat?pick([["金"],["木","水"],["火"],["土","金"],["水"]]):[];
 return {
   name:base.name+"·"+pick(["青","寧","川","月","安","遠","禾","真"]),
   gender:base.gender,romance:true,style:CAREERS[career]?.kind==="修士"?career:"凡俗",career,home:pick(Object.keys(WORLDS).filter(x=>["城鎮","巨城","港城","邊城","大城","島城"].includes(WORLDS[x].type))),
   personality:`${base.personality}，${trait}`,trait,combatCapable:!!CAREERS[career]?.combat,ageYears:age,ageMonths:rand(12),aff:25+rand(21),trust:25+rand(21),
   status:"相識",usedChats:[],storyDone:[],skills:npcSkillsFor(career),stats:{hp:4+rand(5),str:3+rand(6),spd:3+rand(6),qi:3+rand(6),wis:3+rand(6)},location:place,pregnancy:null
 }
}
function npcSkillsFor(career){
 if(career==="劍修")return ["金刃斬","疾風步"];if(career==="醫修")return ["回春術","水箭術"];if(career==="符修")return ["火球術","水箭術"];
 if(career==="獵妖人")return ["震山拳"];if(career==="散修")return [pick(["火球術","水箭術","震山拳"])];return []
}
function recruitNPC(t,force=false){
 let n=(t.usedChats!==undefined)?t:generateNPC(G.place);
 if(G.companions.some(x=>x.name===n.name))return;
 if(force||chance(.65)){n.status=n.status==="相識"?(n.combatCapable?"夥伴":"友人"):n.status;G.companions.push(n);addLog(`${n.name}（${n.career}）與你建立了長期聯繫。`,"good")}
}
function getActiveNPC(){return G.companions.find(x=>x.name===G.activeCompanion)}
function canFollow(n){return n.combatCapable||n.status==="道侶"}
function doTravel(to,days){
 if(G.combat||G.pendingTravel)return;let from=G.place,segments=Math.max(1,Math.floor(days/5));G.pendingTravel={from,to,days};advanceDays(days);
 for(let i=0;i<segments;i++){if(chance(.55)){let combatStarted=travelEncounter(from,to);if(combatStarted){render();return}}}
 finishTravel()
}
function finishTravel(){
 let p=G.pendingTravel;if(!p)return;G.place=p.to;discover(p.to);
 for(const x of Object.keys(ROUTES[p.to]||{}))if(chance(.75))discover(x);
 for(const n of G.companions)if(n.status==="道侶"||n.name===G.activeCompanion){if(canFollow(n))n.location=p.to}
 addLog(`你從${p.from}抵達${p.to}，共行${p.days}日。`,"info");G.pendingTravel=null;render()
}
function travelEncounter(from,to){
 let name=pick(TRAVEL_EVENTS),danger=Math.max(1,Math.round(((WORLDS[from]?.danger||0)+(WORLDS[to]?.danger||0))/2));
 let hostile=["妖獸足跡","失控靈獸","毒霧","小型獸潮","黑市引路人","求救符"];
 if(hostile.includes(name)&&chance(.55)){addLog(`【旅途事件】${name}。事情很快演變成戰鬥。`,"bad");startCombat(name==="黑市引路人"?{name:"攔路魔修",level:danger+1,maxHp:48+danger*14,atk:10+danger*4,spd:7+danger*2,reward:14+danger*6,type:"魔修"}:randomEnemy(danger),"travel");return true}
 if(["河中漂箱","墜落飛劍","流星墜地","無主洞府","靈泉傳聞","山壁刻字"].includes(name)){
   let q=createClueQuest(from,to);q.title=name+"之謎";q.desc=`旅途中遇到「${name}」，其中似乎藏著值得追查的秘密。`;addQuest(q);addLog(`【旅途事件】${name}，形成新任務「${q.title}」。`,"rare");return false
 }
 if(["受傷商隊","逃難村民","迷路孩童","尋藥老者","採藥少女","送葬隊伍"].includes(name)){
   let s=rand(7)+2;G.rep+=1;G.spiritStones+=s;addLog(`【旅途事件】${name}。你伸手相助，得到${s}靈石或等值謝禮。`,"good");return false
 }
 if(["鏢師比武","路邊棋局","修士論道","兩派弟子爭執","夜半琴聲","沉默刀客"].includes(name)){
   let npc=generateNPC(to);addLog(`【旅途事件】${name}。你因此認識了${npc.name}（${npc.career}）。`,"info");recruitNPC(npc,chance(.35));return false
 }
 if(name==="靈石騙局"){let loss=Math.min(G.spiritStones,rand(6));G.spiritStones-=loss;addLog(`【旅途事件】靈石騙局。你損失${loss}枚靈石。`,"bad");return false}
 if(name==="山火"||name==="洪水改道"||name==="斷橋"||name==="山雨突至"){advanceDays(1+rand(3));addLog(`【旅途事件】${name}，行程因此被耽擱。`,"info");return false}
 addLog(`【旅途事件】${name}。這段插曲沒有造成嚴重後果，卻成了旅途的一段記憶。`,"info");return false
}

/* Dialogue, relationships, stories */
function peopleTab(b){
 let list=G.companions,partner=G.companions.find(x=>x.name===G.partner);
 b.innerHTML=`<div class="notice">每名角色都有年齡、職業、性格與自己的生活。平民友人不會跟著冒險或參戰；若成為道侶，則可以同行，但仍不一定具備戰鬥能力。</div>
 ${partner?`<div class="choice"><h4>道侶：${partner.name}</h4><p>性別：${partner.gender}｜${partner.ageYears}歲${partner.ageMonths?partner.ageMonths+"個月":""}｜職業：${partner.career}｜好感 ${partner.aff}｜信任 ${partner.trust}</p><div class="row"><button onclick="chatNPC(${list.indexOf(partner)})">閒聊</button><button onclick="dualCultivate()">雙修</button><button ${G.ageYears<18||partner.ageYears<18?"disabled":""} onclick="intimacy()">陰陽交合</button></div>${G.ageYears<18||partner.ageYears<18?"<p class='muted small'>親密人生選項僅在雙方年滿18歲後開放。</p>":""}</div>`:""}
 ${list.map((n,i)=>`<div class="choice"><h4>${n.name} · ${n.status}${G.activeCompanion===n.name?"（上場）":""}</h4><p>性別：${n.gender}｜${n.ageYears}歲${n.ageMonths?n.ageMonths+"個月":""}｜職業：${n.career}｜${n.trait||""}</p><p>好感 ${n.aff}｜信任 ${n.trust}｜所在地：${n.location||G.place}</p><div class="row"><button onclick="chatNPC(${i})">閒聊</button><button onclick="giftNPC(${i})">贈與物品</button>${n.combatCapable?`<button onclick="setActive(${i})">設為上場夥伴</button>`:""}${n.romance&&n.aff>=85&&n.trust>=75&&!G.partner&&G.ageYears>=18&&n.ageYears>=18?`<button onclick="confess(${i})">表明心意</button>`:""}</div></div>`).join("")||"<p class='muted'>尚無長期聯繫的人物。</p>"}
 <h3>兒女</h3>${G.children.map(c=>`<div class="family-card"><b>${c.name}</b>｜${c.gender}｜${c.ageYears}歲${c.ageMonths?c.ageMonths+"個月":""}｜${c.career}<br><span class="muted small">所在地：${c.location||"隨家人"}</span></div>`).join("")||"<p class='muted'>目前沒有兒女。</p>"}`
}
function chatNPC(i){
 let n=G.companions[i];if(!n)return;
 if(!n.usedChats)n.usedChats=[];
 let available=CHAT_TOPICS.filter(t=>!n.usedChats.includes(t.id));if(!available.length){n.usedChats=[];available=CHAT_TOPICS}
 let topic=pick(available);n.usedChats.push(topic.id);
 showInfo(`與${n.name}閒聊`,`<p>${topic.text}</p>${topic.choices.map((c,ci)=>`<button class="dialogue-choice" onclick="resolveChatChoice(${i},'${topic.id}',${ci})">${c.label}</button>`).join("")}`)
}
function resolveChatChoice(i,topicId,choiceIndex){
 let n=G.companions[i],topic=CHAT_TOPICS.find(x=>x.id===topicId);if(!n||!topic)return;let c=topic.choices[choiceIndex];
 advanceDays(1);n.aff=clamp(n.aff+c.aff,0,100);n.trust=clamp(n.trust+c.trust,0,100);
 addLog(`你與${n.name}談到「${topic.cat}」，選擇「${c.label}」。好感${c.aff>=0?"+":""}${c.aff}、信任${c.trust>=0?"+":""}${c.trust}。`,"info");
 maybeTriggerNpcStory(n,topic.cat);checkFriend(n);hideInfo();render()
}
function maybeTriggerNpcStory(n,cat){
 if(!n.storyDone)n.storyDone=[];if(n.aff<45||n.storyDone.length>=4||!chance(.28))return;
 let candidates=NPC_STORY_TEMPLATES.filter(s=>!n.storyDone.includes(s.key));if(!candidates.length)return;let s=pick(candidates);n.storyDone.push(s.key);
 let q={id:"npcstory"+Date.now()+rand(99999),title:`${n.name}：${s.title}`,type:"npcstory",place:n.home,desc:`${s.desc} 這不是一件單純的委託，而是${n.name}人生的一部分。`,status:"active",source:`與${n.name}談到${cat}`,npc:n.name};
 addQuest(q);addLog(`${n.name}終於願意說出一段往事。特殊人物任務「${q.title}」開啟。`,"rare")
}
function setActive(i){
 let n=G.companions[i];if(!n?.combatCapable){alert("這名角色沒有冒險戰鬥能力。");return}
 G.activeCompanion=n.name;n.status=n.status==="相識"?"夥伴":n.status;addLog(`${n.name}成為你的上場夥伴。`,"info");render()
}

 <h3>技能書</h3>${G.skillBooks.map((s,i)=>`<div class="choice"><h4>《${s}》</h4><p>${SKILLS[s]?.desc||""}</p><button onclick="learnSkill(${i})">研習</button></div>`).join("")||"<p class='muted'>沒有未研習的技能書。</p>"}`
}
function equipSkill(s){if(!G.learnedSkills.includes(s)||G.equippedSkills.includes(s)||G.equippedSkills.length>=2)return;G.equippedSkills.push(s);addLog(`你將「${s}」放入戰鬥技能槽。`,"info");render()}
function unequipSkill(i){G.equippedSkills.splice(i,1);render()}

/* RPG equipment */
MARKET_CATALOG.push(
 {name:"皮甲",type:"armor",def:3,price:22,desc:"輕便耐用的護甲。"},
 {name:"玄鐵護甲",type:"armor",def:6,price:58,desc:"沉重但防護良好。"},
 {name:"青玉佩",type:"accessory",hp:8,price:38,desc:"溫潤玉佩，佩戴後氣血較穩。"},
 {name:"踏風墜",type:"accessory",spd:2,price:52,desc:"輕微提升身法。"}
);
function equipTab(b){
 let eq=G.equipment||{};b.innerHTML=`<div class="notice">點選裝備欄可瀏覽與更換裝備；在背包中長按裝備可查看詳細屬性。</div>
 <div class="slot-grid">
 <div class="slot" onclick="chooseEquipment('weapon')"><b>武器</b><p>${eq.weapon?.name||"空"}</p></div>
 <div class="slot" onclick="chooseEquipment('armor')"><b>護甲</b><p>${eq.armor?.name||"空"}</p></div>
 <div class="slot" onclick="chooseEquipment('accessory')"><b>飾品</b><p>${eq.accessory?.name||"空"}</p></div>
 </div>`
}
function chooseEquipment(type){
 let items=G.inventory.map((x,i)=>({x,i})).filter(o=>o.x.type===type);
 showInfo(`選擇${type==="weapon"?"武器":type==="armor"?"護甲":"飾品"}`,items.map(o=>`<div class="choice"><h4>${o.x.name}</h4><p>${o.x.atk?`攻擊+${o.x.atk} `:""}${o.x.def?`防禦+${o.x.def} `:""}${o.x.hp?`生命+${o.x.hp} `:""}${o.x.spd?`速度+${o.x.spd}`:""}</p><button onclick="equipItem(${o.i})">裝備</button></div>`).join("")||"<p>沒有此類裝備。</p>")
}
function equipItem(i){let x=G.inventory[i];if(!x||!["weapon","armor","accessory"].includes(x.type))return;G.equipment[x.type]=x;if(x.type==="weapon")G.equippedWeapon=x;addLog(`你裝備了「${x.name}」。`,"info");hideInfo();render()}
function bagTab(b){
 let groups=compactInventoryEntries();b.innerHTML=`<div class="row"><h3 style="margin:0">背包</h3><span class="muted small">${G.inventory.length} 件物品</span></div>
 <div class="compact-grid">${groups.map(g=>`<div class="compact-item" onpointerdown="longPressStart('item',${g.index})" onpointerup="longPressEnd()" onpointercancel="longPressEnd()" onpointerleave="longPressEnd()"><h4>${g.item.name}${g.count>1?` ×${g.count}`:""}</h4><p>${g.item.type==="weapon"?"武器":g.item.type==="armor"?"護甲":g.item.type==="accessory"?"飾品":g.item.type==="consumable"?"消耗品":"物品"}</p>${["weapon","armor","accessory"].includes(g.item.type)?`<button onclick="equipItem(${g.index})">裝備</button>`:""}</div>`).join("")||"<p class='muted'>背包是空的。</p>"}</div>
 <h3>寶物</h3><div class="compact-grid">${G.treasures.map(x=>`<div class="compact-item"><h4>${x.name}</h4><p>${x.buff}</p></div>`).join("")||"<p class='muted'>尚無寶物。</p>"}</div>`
}

/* Title long press */
function summary(){document.getElementById("summary").innerHTML=`
 <div class="kv"><span class="muted">姓名</span><b>${G.name}</b><span class="muted">性別</span><span>${G.gender||"未定"}</span><span class="muted">年齡</span><span>${fmtAge()}</span><span class="muted">年代</span><span>${fmtDate()}</span><span class="muted">境界</span><span>${G.realm}</span><span class="muted">宗門</span><span>${G.sect||"散修"}</span><span class="muted">所在地</span><span>${G.place||"未定"}</span><span class="muted">靈石</span><span>${G.spiritStones}</span></div>
 <div class="stat-grid" style="margin-top:10px">${Object.entries(G.stats).map(([k,v])=>`<div class="stat">${STAT_NAMES[k]}<b>${v}</b></div>`).join("")}</div>
 <div style="margin-top:8px">${G.titles.map((t,i)=>`<span class="pill gold" onpointerdown="longPressStart('title',${i})" onpointerup="longPressEnd()" onpointerleave="longPressEnd()" onpointercancel="longPressEnd()">【${t.name}】</span>`).join("")}${G.traits.map(x=>`<span class="pill">${x}</span>`).join("")}</div>`}

/* Companion AI combat */
function npcMaxHP(n){return 40+(n.stats?.hp||4)*7}
function npcMaxQI(n){return 20+(n.stats?.qi||3)*8}
function companionPower(n){return (n.stats?.str||3)+(n.stats?.qi||3)+(n.stats?.spd||3)+(n.skills?.length||0)*3}
function startCombat(enemy,source){
 if(G.combat)return false;let n=getActiveNPC();let comp=null;
 if(n&&n.combatCapable&&n.location===G.place&&!n.injured){comp={name:n.name,hp:npcMaxHP(n),qi:npcMaxQI(n),fled:false,down:false}}
 G.combat={enemy,source,pHP:playerMaxHP(),pQI:playerMaxQI(),eHP:enemy.maxHp,guardEscape:0,turn:1,busy:false,companion:comp,log:[`遭遇${enemy.name}！`]};renderCombatModal();return true
}
function renderCombatModal(){
 let o=document.getElementById("combatOverlay"),w=document.getElementById("combatWindow");if(!o||!w)return;if(!G.combat){hideCombatModal();return}
 let c=G.combat,e=c.enemy,n=c.companion?G.companions.find(x=>x.name===c.companion.name):null;o.classList.add("show");o.setAttribute("aria-hidden","false");
 w.innerHTML=`<div class="row" style="justify-content:space-between"><b class="gold">戰鬥</b><span class="muted small">第 ${c.turn} 回合</span></div>
 <div class="arena"><div class="fighter enemy"><div class="fighter-top"><b>⬛ ${e.name}</b><span>${e.type} · 威脅${e.level}</span></div><p class="small">生命 ${Math.max(0,c.eHP)}/${e.maxHp}</p><div class="progress hpbar"><span style="width:${clamp(c.eHP/e.maxHp*100,0,100)}%"></span></div></div>
 <div class="battle-space">─── 對 戰 ───</div>
 <div>${c.companion&&!c.companion.fled&&!c.companion.down?`<div class="fighter" style="margin-bottom:7px"><div class="fighter-top"><b>◇ ${c.companion.name}</b><span>AI夥伴 · ${n?.career||""}</span></div><p class="small">生命 ${Math.max(0,c.companion.hp)}/${n?npcMaxHP(n):1}｜靈氣 ${Math.max(0,c.companion.qi)}/${n?npcMaxQI(n):1}</p></div>`:""}<div class="fighter player"><div class="fighter-top"><b>⬜ ${G.name}</b><span>${c.companion&&!c.companion.fled?"並肩作戰":"獨自作戰"}</span></div><p class="small">生命 ${Math.max(0,c.pHP)}/${playerMaxHP()}｜靈氣 ${Math.max(0,c.pQI)}/${playerMaxQI()}</p><div class="progress hpbar"><span style="width:${clamp(c.pHP/playerMaxHP()*100,0,100)}%"></span></div><div class="progress qibar" style="margin-top:5px"><span style="width:${clamp(c.pQI/playerMaxQI()*100,0,100)}%"></span></div></div></div></div>
 <div class="combat-actions"><button class="primary" ${c.busy?"disabled":""} onclick="combatAction('attack')">一般攻擊</button>${G.equippedSkills.map(s=>`<button ${c.busy||c.pQI<SKILLS[s].qi?"disabled":""} onclick="combatSkill('${s}')">${s}（${SKILLS[s].qi}氣）</button>`).join("")}<button ${c.busy?"disabled":""} onclick="combatAction('escape')">逃跑</button></div>
 <div class="combat-log">${c.log.slice(-8).map(x=>`<div>${x}</div>`).join("")}</div>`
}
function companionTurn(){
 let c=G.combat;if(!c||!c.companion||c.companion.fled||c.companion.down)return false;
 let n=G.companions.find(x=>x.name===c.companion.name);if(!n)return false;
 let threat=c.enemy.level*8+10,power=companionPower(n);
 if(n.trait==="膽小"&&threat>power*1.25&&chance(.48)){c.companion.fled=true;c.log.push(`${n.name}被強敵震懾，竟在戰鬥中逃走，留下你獨自應戰！`);n.trust=clamp(n.trust-4,0,100);return false}
 let usable=(n.skills||[]).filter(s=>SKILLS[s]&&SKILLS[s].qi<=c.companion.qi);
 let heal=usable.find(s=>SKILLS[s].utility==="heal");
 if(heal&&c.companion.hp<npcMaxHP(n)*.42){c.companion.qi-=SKILLS[heal].qi;let h=16+(n.stats?.qi||3);c.companion.hp=clamp(c.companion.hp+h,0,npcMaxHP(n));c.log.push(`${n.name}自行施展${heal}，恢復${h}生命。`);return false}
 let attackSkill=usable.find(s=>!SKILLS[s].utility);
 if(attackSkill&&chance(.6)){c.companion.qi-=SKILLS[attackSkill].qi;let dmg=Math.round(SKILLS[attackSkill].power+(n.stats?.qi||3)*1.25);c.eHP-=dmg;c.log.push(`${n.name}自行施展${attackSkill}，造成${dmg}傷害。`)}
 else{let dmg=Math.round(5+(n.stats?.str||3)*1.7);c.eHP-=dmg;c.log.push(`${n.name}自行攻擊，造成${dmg}傷害。`)}
 if(c.eHP<=0){winCombat();return true}return false
}
function combatAction(a){
 let c=G.combat;if(!c||c.busy)return;let e=c.enemy;c.busy=true;
 if(a==="attack"){let dmg=Math.round((5+G.stats.str*2+(G.equipment?.weapon?.atk||G.equippedWeapon?.atk||0))*combatPowerBuff(e)*(0.85+Math.random()*.3));c.eHP-=dmg;c.log.push(`你一般攻擊，造成 ${dmg} 傷害。`);if(c.eHP<=0){c.busy=false;return winCombat()}}
 if(a==="escape"){let base=.62+(G.stats.spd-e.spd)*.045+c.guardEscape+G.treasures.reduce((a,t)=>a+(t.escape||0),0)+G.titles.reduce((a,t)=>a+(t.escape||0),0);if(chance(clamp(base,.08,.92))){addLog(`你成功從${e.name}手中逃走。`,"info");let source=c.source;G.combat=null;hideCombatModal();if(source==="travel"&&G.pendingTravel)return finishTravel();render();return}else c.log.push("逃跑失敗！")}
 c.busy=false;if(companionTurn())return;enemyTurn()
}
function combatSkill(s){
 let c=G.combat;if(!c||c.busy||!G.equippedSkills.includes(s))return;let e=c.enemy,sk=SKILLS[s];if(!sk||c.pQI<sk.qi)return;c.busy=true;c.pQI-=sk.qi;
 if(sk.utility==="heal"){let heal=-sk.power+Math.floor(G.stats.qi*.6);c.pHP=clamp(c.pHP+heal,0,playerMaxHP());c.log.push(`你施展${s}，恢復 ${heal} 生命。`)}
 else if(sk.utility==="escape"){c.guardEscape+=.22;c.log.push(`你施展${s}，本場逃跑機率提高。`)}
 else{let dmg=Math.round((sk.power+G.stats.qi*1.4+G.stats.wis*.5)*combatPowerBuff(e)*(0.88+Math.random()*.25));c.eHP-=dmg;c.log.push(`你施展${s}，造成 ${dmg} 傷害。`);if(c.eHP<=0){c.busy=false;return winCombat()}}
 c.busy=false;if(companionTurn())return;enemyTurn()
}
function enemyTurn(){
 let c=G.combat;if(!c)return;let e=c.enemy,n=c.companion?G.companions.find(x=>x.name===c.companion.name):null;
 let hitComp=c.companion&&!c.companion.fled&&!c.companion.down&&chance(.32);
 if(hitComp){let dmg=Math.max(1,Math.round(e.atk*(.82+Math.random()*.3)-(n?.stats?.hp||3)*.4));c.companion.hp-=dmg;c.log.push(`${e.name}攻擊${c.companion.name}，造成${dmg}傷害。`);if(c.companion.hp<=0){c.companion.down=true;if(n)n.injured=true;c.log.push(`${c.companion.name}重傷倒下，退出本場戰鬥。`)}}
 else{let dodge=clamp(.05+(G.stats.spd-e.spd)*.025,0,.35);if(chance(dodge))c.log.push(`你閃過${e.name}的攻擊。`);else{let armor=G.equipment?.armor?.def||0;let dmg=Math.max(1,Math.round(e.atk*(.85+Math.random()*.3)-G.stats.hp*.5-armor));c.pHP-=dmg;c.log.push(`${e.name}反擊，造成 ${dmg} 傷害。`)}}
 if(c.pHP<=0){let eName=e.name;G.combat=null;hideCombatModal();die(`你在與${eName}的戰鬥中身亡。`);return}c.turn++;renderCombatModal()
}

/* Dual cultivation, adult intimacy, pregnancy, children */
function cultivationGain(days,multExtra=1){let mult=G.roots.length===1?1.35:G.roots.length===2?1.15:G.roots.length===3?1:.82;let tbonus=1+G.treasures.reduce((a,t)=>a+(t.cult||0),0);return Math.max(1,Math.round((G.stats.qi+G.stats.wis/2)*mult*tbonus*days/28*multExtra))}
function applyCultGain(gain){G.cult+=gain;while(G.cult>=100&&G.realm!=="煉氣大圓滿"){G.cult-=100;let a=["一","二","三","四","五","六","七","八","九"],m=G.realm.match(/煉氣(.)層/);if(m){let i=a.indexOf(m[1]);if(i<8){G.realm=`煉氣${a[i+1]}層`;addLog(`突破至${G.realm}！`,"good")}else{G.realm="煉氣大圓滿";G.cult=100}}}}
function cultivate(days){advanceDays(days);let gain=cultivationGain(days);applyCultGain(gain);addLog(`修煉${days}日，修為增加${gain}。`);render()}
function dualCultivate(){
 let n=G.companions.find(x=>x.name===G.partner);if(!n)return;advanceDays(7);let gain=cultivationGain(7,2);applyCultGain(gain);n.aff=clamp(n.aff+2,0,100);n.trust=clamp(n.trust+2,0,100);addLog(`你與${n.name}雙修七日，陰陽靈機相輔，獲得雙倍修為經驗（+${gain}）。`,"rare");render()
}
function intimacy(){
 let n=G.companions.find(x=>x.name===G.partner);if(!n||G.ageYears<18||n.ageYears<18)return;
 advanceDays(1);n.aff=clamp(n.aff+3,0,100);n.trust=clamp(n.trust+2,0,100);addLog(`你與${n.name}共度親密時光，感情更加深厚。`,"info");
 let female=n.gender==="女"?n:(G.gender==="女"?{name:G.name,player:true,stats:G.stats}:null);
 if(female){
   let already=female.player?G.playerPregnancy:n.pregnancy;
   if(!already){let hp=female.player?G.stats.hp:(female.stats?.hp||5);let p=clamp(.06+hp*.018+n.aff*.0012,.08,.36);if(chance(p)){let preg={days:270,known:false,father:G.gender==="男"?G.name:n.name,mother:female.player?G.name:n.name};if(female.player)G.playerPregnancy=preg;else n.pregnancy=preg}}
 }
 render()
}
function giveBirth(owner){
 let mother=owner==="player"?G.name:owner;let sex=chance(.5)?"男":"女";let surname=G.name.slice(0,1)||"林";let child={id:"child"+Date.now()+rand(9999),name:surname+pick(["安","寧","川","月","禾","清","遠","星","昭","念"]),gender:sex,ageYears:0,ageMonths:0,career:"幼童",location:G.place,parents:[G.name,G.partner]};
 G.children.push(child);if(owner==="player")G.playerPregnancy=null;else{let n=G.companions.find(x=>x.name===owner);if(n)n.pregnancy=null}
 addLog(`${mother}平安生下一名${sex==="男"?"男":"女"}孩「${child.name}」。你的人生從此多了一個新的牽掛。`,"rare")
}

/* Property system */
function propertyTab(b){
 if(!hasMarket()){b.innerHTML="<p class='muted'>只有城鎮、城市與港口能購置地產。</p>";return}
 let owned=G.properties.filter(p=>p.place===G.place);let base=WORLDS[G.place].type==="巨城"?220:WORLDS[G.place].type==="大城"?170:120;
 b.innerHTML=`<div class="notice">地產可以安置道侶與兒女。16歲以下兒女不能被單獨留在沒有成年家人的地產。</div>
 <h3>本地出售</h3><div class="row"><button onclick="buyProperty('小院',${base})">小院 ${base}靈石</button><button onclick="buyProperty('宅邸',${base*3})">宅邸 ${base*3}靈石</button></div>
 <h3>你的地產</h3>${owned.map(p=>`<div class="choice"><h4>${p.name}</h4><p>住戶：${p.occupants.length?p.occupants.join("、"):"無"}</p><div class="row">${G.partner?`<button onclick="housePartner('${p.id}')">安置道侶</button>`:""}<button onclick="houseFamily('${p.id}')">安置全家</button>${G.children.map((c,i)=>`<button onclick="houseChild('${p.id}',${i})">安置${c.name}</button>`).join("")}</div></div>`).join("")||"<p class='muted'>本地尚無地產。</p>"}`
}
function buyProperty(type,price){if(G.spiritStones<price)return alert("靈石不足。");G.spiritStones-=price;G.properties.push({id:"prop"+Date.now()+rand(999),name:`${G.place}·${type}`,place:G.place,type,occupants:[]});addLog(`你在${G.place}購置了一處${type}。`,"good");render()}
function housePartner(id){let p=G.properties.find(x=>x.id===id),n=G.companions.find(x=>x.name===G.partner);if(!p||!n)return;if(!p.occupants.includes(n.name))p.occupants.push(n.name);n.location=p.place;addLog(`${n.name}已安置在${p.name}。`,"info");render()}
function houseFamily(id){let p=G.properties.find(x=>x.id===id);if(!p)return;let n=G.companions.find(x=>x.name===G.partner);if(n&&!p.occupants.includes(n.name)){p.occupants.push(n.name);n.location=p.place}for(const c of G.children){if(!p.occupants.includes(c.name))p.occupants.push(c.name);c.location=p.place}addLog(`你將家人安置在${p.name}。`,"info");render()}
function houseChild(id,i){let p=G.properties.find(x=>x.id===id),c=G.children[i];if(!p||!c)return;let hasAdult=p.occupants.some(name=>{let n=G.companions.find(x=>x.name===name);if(n)return n.ageYears>=18;let ch=G.children.find(x=>x.name===name);return ch&&ch.ageYears>=18});if(c.ageYears<16&&!hasAdult)return alert("16歲以下兒女不能獨自安置，請先安置一名成年家人或使用「安置全家」。");if(!p.occupants.includes(c.name))p.occupants.push(c.name);c.location=p.place;render()}

/* Save / death */
function die(t){G.alive=false;addLog(t,"bad");render()}
function death(){setScreen(`<div class="title">人物生平</div><p>${G.name}，卒於${fmtDate()}，享年${fmtAge()}。</p><button class="primary" onclick="newGame()">開始下一世</button>`)}
function normalizeSave(){
 if(!G.gender)G.gender="男";
 if(!G.marketCache)G.marketCache={};if(G.pendingTravel===undefined)G.pendingTravel=null;
 if(!G.companions)G.companions=[];if(!G.inventory)G.inventory=[];if(!G.skillBooks)G.skillBooks=[];if(!G.learnedSkills)G.learnedSkills=[];
 if(!G.equippedSkills)G.equippedSkills=G.learnedSkills.slice(0,2);if(!G.treasures)G.treasures=[];if(!G.titles)G.titles=[];
 if(!G.children)G.children=[];if(!G.properties)G.properties=[];if(G.playerPregnancy===undefined)G.playerPregnancy=null;
 if(!G.equipment)G.equipment={weapon:G.equippedWeapon||null,armor:G.inventory.find(x=>x.type==="armor")||null,accessory:null};
 if(!G.flags)G.flags={};if(G.flags.sectExamYear===undefined)G.flags.sectExamYear=null;
 for(const [i,t] of G.titles.entries()){if(!t.source)t.source=titleSource(t.name)}
 for(const n of G.companions){
   if(!n.gender){let t=NPC_TEMPLATES.find(x=>x.name.startsWith(n.name));n.gender=t?.gender||"未知"}
   if(!n.career)n.career=n.style||"散修";if(n.ageYears===undefined)n.ageYears=18+rand(12);if(n.ageMonths===undefined)n.ageMonths=rand(12);
   if(n.combatCapable===undefined)n.combatCapable=!!CAREERS[n.career]?.combat||["散修","醫修","劍修","符修"].includes(n.style);
   if(!n.trait)n.trait=n.personality?.includes("膽")?"膽小":pick(["謹慎","好奇","重情","冷靜"]);
   if(!n.usedChats)n.usedChats=[];if(!n.storyDone)n.storyDone=[];if(!n.skills)n.skills=npcSkillsFor(n.career);
   if(!n.stats)n.stats={hp:4+rand(5),str:3+rand(6),spd:3+rand(6),qi:3+rand(6),wis:3+rand(6)};
   if(!n.location)n.location=G.place;if(n.pregnancy===undefined)n.pregnancy=null
 }
 if(G.combat){G.combat.busy=false;if(!G.combat.turn)G.combat.turn=1}
 G.version="0.6"
}
function saveGame(){localStorage.setItem("dahuang06",JSON.stringify(G));addLog("遊戲已儲存。","info");render()}
function loadGame(){
 let s=localStorage.getItem("dahuang06")||localStorage.getItem("dahuang05")||localStorage.getItem("dahuang04");
 if(!s)return alert("沒有可讀取的存檔");G=JSON.parse(s);normalizeSave();addLog("存檔已載入。","info");render()
}
function newGame(){if(confirm("開始新局？")){G=fresh();render()}}
G=fresh();render();
</script>
