<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>大荒域：凡塵問仙 Alpha</title>
<style>
:root{
  --bg:#0d1117; --panel:#151b23; --panel2:#0f151d; --line:#2a3442;
  --text:#e9edf2; --muted:#9aa7b5; --gold:#d9b76c; --red:#b85b5b;
  --green:#6fba83; --blue:#6da4d8; --purple:#9b7bd1;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#17202b 0,#0d1117 42%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif}
button,select,input{font:inherit}
.app{max-width:1180px;margin:auto;padding:14px}
.header{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}
.brand h1{font-size:22px;margin:0;color:var(--gold);letter-spacing:.06em}
.brand small{color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button{background:#222c38;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer}
button:hover{filter:brightness(1.12)}
button.primary{background:#6f5625;border-color:#9a7938}
button.danger{background:#522728;border-color:#7a3838}
button:disabled{opacity:.45;cursor:not-allowed}
.grid{display:grid;grid-template-columns:310px 1fr;gap:12px}
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 10px 30px #0003}
.card h2,.card h3{margin-top:0;color:var(--gold)}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.stat{border:1px solid var(--line);border-radius:10px;padding:8px;background:#111821}
.stat b{float:right;color:#fff}
.pill{display:inline-block;padding:3px 7px;border:1px solid var(--line);border-radius:999px;margin:2px 3px 2px 0;color:#cfd7e0;background:#111821;font-size:12px}
.muted{color:var(--muted)}
.screen{min-height:560px}
.title{font-size:25px;color:var(--gold);margin-bottom:4px}
.subtitle{color:var(--muted);margin-bottom:18px}
.choice{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;background:#121923}
.choice:hover{border-color:#806936}
.choice h4{margin:0 0 6px}
.choice p{margin:3px 0;color:#bdc7d2}
.choice button{margin-top:8px}
.log{max-height:250px;overflow:auto;font-size:13px;line-height:1.55}
.log .entry{border-bottom:1px dashed #27313d;padding:6px 0}
.good{color:var(--green)} .bad{color:#dc7c7c} .info{color:#7fb1de} .rare{color:#b99be9}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.root-btn{min-width:72px}
.root-btn.on{outline:2px solid var(--gold);background:#3b3220}
.cost{color:var(--gold)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:5px 10px;font-size:14px}
.progress{height:8px;background:#232b35;border-radius:999px;overflow:hidden}
.progress>span{display:block;height:100%;background:linear-gradient(90deg,#886c34,#d0ac59)}
.notice{padding:10px;border-left:3px solid var(--gold);background:#201b12;border-radius:8px;color:#e5d2a6}
@media(max-width:780px){
 .grid{grid-template-columns:1fr}
 .header{align-items:flex-start}
 .screen{min-height:460px}
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="brand">
      <h1>大荒域：凡塵問仙</h1>
      <small>Alpha 0.1 · 單檔 HTML</small>
    </div>
    <div class="actions">
      <button onclick="saveGame()">儲存</button>
      <button onclick="loadGame()">讀取</button>
      <button class="danger" onclick="newGame()">新局</button>
    </div>
  </div>

  <div class="grid">
    <aside class="card">
      <h3>角色狀態</h3>
      <div id="summary"></div>
      <hr style="border-color:var(--line);border-style:solid;border-width:1px 0 0;margin:14px 0">
      <h3>人生紀錄</h3>
      <div id="log" class="log"></div>
    </aside>

    <main id="screen" class="card screen"></main>
  </div>
</div>

<script>
const STAT_NAMES={hp:"體力",str:"力量",spd:"速度",qi:"氣根",wis:"悟性",cha:"魅力"};
const ROOTS=["金","木","水","火","土"];
const ROOT_COST={1:10,2:6,3:3,4:1,5:0};
const STAT_COST={4:1,5:1,6:1,7:2,8:2,9:3,10:4};

let G;

function freshState(){
 return {
  version:"0.1",
  phase:"create",
  year:742, age:0,
  fate:20, background:null, region:null, hometown:null,
  name:"無名",
  stats:{hp:3,str:3,spd:3,qi:3,wis:3,cha:3},
  roots:[],
  traits:[],
  skills:[],
  rep:{world:0,righteous:0,demonic:0},
  relations:{},
  flags:{},
  events:[],
  realm:"凡人",
  cultivation:0,
  offers:[],
  currentPlace:null,
  alive:true
 };
}
function rand(n){return Math.floor(Math.random()*n)}
function pick(a){return a[rand(a.length)]}
function chance(p){return Math.random()<p}
function addLog(text, cls=""){
 G.events.unshift({text,cls,age:G.age,year:G.year});
 renderLog();
}
function addTrait(t){if(!G.traits.includes(t))G.traits.push(t)}
function addSkill(s){if(!G.skills.includes(s))G.skills.push(s)}
function modStat(k,n){G.stats[k]=Math.max(1,Math.min(10,G.stats[k]+n))}
function relation(id,name){
 if(!G.relations[id]) G.relations[id]={name,aff:50,trust:50,alive:true,role:"童年好友"};
 return G.relations[id];
}
function updateSummary(){
 const el=document.getElementById("summary");
 const roots=G.roots.length?G.roots.join("、")+"靈根":"尚未設定";
 el.innerHTML=`
 <div class="kv">
  <div class="muted">姓名</div><div>${G.name}</div>
  <div class="muted">年齡</div><div>${G.age}歲</div>
  <div class="muted">年代</div><div>大曆 ${G.year} 年</div>
  <div class="muted">出身</div><div>${G.background||"未定"}</div>
  <div class="muted">故鄉</div><div>${G.hometown||"未定"}</div>
  <div class="muted">境界</div><div>${G.realm}</div>
  <div class="muted">靈根</div><div>${roots}</div>
 </div>
 <h3 style="margin-top:14px">六維</h3>
 <div class="stat-grid">
 ${Object.entries(G.stats).map(([k,v])=>`<div class="stat">${STAT_NAMES[k]}<b>${v}</b></div>`).join("")}
 </div>
 <h3 style="margin-top:14px">性格／技能</h3>
 <div>${G.traits.map(x=>`<span class="pill">${x}</span>`).join("")||'<span class="muted">尚未形成</span>'}</div>
 <div style="margin-top:6px">${G.skills.map(x=>`<span class="pill">${x}</span>`).join("")}</div>
 `;
}
function renderLog(){
 const el=document.getElementById("log");
 el.innerHTML=G.events.slice(0,50).map(e=>`<div class="entry ${e.cls||""}"><span class="muted">${e.year}年·${e.age}歲</span>　${e.text}</div>`).join("")||'<span class="muted">尚無紀錄。</span>';
}
function render(){updateSummary();renderLog(); if(!G.alive)return renderDeath(); phaseRouter();}
function phaseRouter(){
 if(G.phase==="create") renderCreate();
 else if(G.phase==="age5") renderAgeEvent(5);
 else if(G.phase==="age8") renderAgeEvent(8);
 else if(G.phase==="age11") renderAgeEvent(11);
 else if(G.phase==="age13") renderAgeEvent(13);
 else if(G.phase==="age15") renderAgeEvent(15);
 else if(G.phase==="test16") renderTest16();
 else if(G.phase==="route") renderRoute();
 else if(G.phase==="cultivation") renderCultivation();
}

function setScreen(html){document.getElementById("screen").innerHTML=html}

function renderCreate(){
 setScreen(`
 <div class="title">角色創建</div>
 <div class="subtitle">先建立出身、天賦與五行靈根。氣運與部分因果由系統隱藏。</div>

 <h3>1. 姓名</h3>
 <div class="row"><input id="nm" value="${G.name==="無名"?"":G.name}" placeholder="輸入角色名" style="padding:10px;border-radius:10px;border:1px solid var(--line);background:#0f151d;color:white"></div>

 <h3 style="margin-top:18px">2. 出生</h3>
 <div class="row">
  <button class="${G.background==="貧寒之家"?"primary":""}" onclick="setBackground('貧寒之家',0)">貧寒之家（0）</button>
  <button class="${G.background==="富貴之家"?"primary":""}" onclick="setBackground('富貴之家',4)">富貴之家（4）</button>
 </div>

 <h3 style="margin-top:18px">3. 六維</h3>
 <div class="notice">所有屬性初始 3。創角最高 10；越高越昂貴。</div>
 <div style="margin-top:8px">
 ${Object.keys(G.stats).map(k=>`
  <div class="choice">
   <b>${STAT_NAMES[k]}</b>　目前：${G.stats[k]}
   <div class="row" style="margin-top:7px">
    <button onclick="statDown('${k}')">−</button>
    <button onclick="statUp('${k}')">＋</button>
   </div>
  </div>`).join("")}
 </div>

 <h3>4. 五行靈根</h3>
 <p class="muted">選 1～5 種。真靈根最昂貴，五行雜靈根免費，但存在稀有隱藏路線。</p>
 <div class="row">
 ${ROOTS.map(r=>`<button class="root-btn ${G.roots.includes(r)?"on":""}" onclick="toggleRoot('${r}')">${r}</button>`).join("")}
 </div>
 <p>目前類型：<b>${rootType()}</b>　消耗：<span class="cost">${rootCost()}命格</span></p>

 <h3>剩餘命格：<span class="cost">${remainingFate()}</span></h3>
 <button class="primary" onclick="startLife()" ${canStart()?"":"disabled"}>降生大荒域</button>
 `);
}
function setBackground(bg,cost){
 const old=G.flags.bgCost||0; G.fate+=old; G.fate-=cost; G.flags.bgCost=cost; G.background=bg; render();
}
function totalStatCost(){
 let t=0;
 for(const v of Object.values(G.stats)){
  for(let x=4;x<=v;x++) t+=STAT_COST[x]||0;
 }
 return t;
}
function rootCost(){return G.roots.length?ROOT_COST[G.roots.length]:0}
function remainingFate(){return 20-(G.flags.bgCost||0)-totalStatCost()-rootCost()}
function statUp(k){if(G.stats[k]<10){G.stats[k]++; if(remainingFate()<0)G.stats[k]--; render()}}
function statDown(k){if(G.stats[k]>3){G.stats[k]--; render()}}
function toggleRoot(r){
 if(G.roots.includes(r)) G.roots=G.roots.filter(x=>x!==r);
 else if(G.roots.length<5) G.roots.push(r);
 if(remainingFate()<0) G.roots=G.roots.filter(x=>x!==r);
 render();
}
function rootType(){
 const n=G.roots.length;
 return n===1?"真靈根":n===2?"雙靈根":n===3?"三靈根":n===4?"偽靈根":n===5?"五行雜靈根":"未選";
}
function canStart(){return G.background && G.roots.length>=1 && remainingFate()>=0}
function startLife(){
 const nm=document.getElementById("nm").value.trim(); if(nm)G.name=nm;
 const regions=["中州","中州","中州","中州","南疆","南疆","西境","北境","東海沿岸"];
 G.region=pick(regions);
 const towns={
  "中州":["柳溪村","安平鎮外·楓橋村","白石村"],
  "南疆":["青禾村","百草山外·南溪村","青雲城郊"],
  "西境":["黑石村","鳳沙城外·赤沙村"],
  "北境":["劍嶺鎮外·雪松村","寒溪村"],
  "東海沿岸":["望月城外·潮生村","流雲港"]
 };
 G.hometown=pick(towns[G.region]); G.currentPlace=G.hometown;
 G.phase="age5"; G.age=5; G.year=747;
 G.flags.luck=rand(101);
 relation("friend",pick(["蘇璃","葉清竹","顧寒","沈棠","陳青","趙虎"]));
 addLog(`出生於${G.region}的${G.hometown}，家境為「${G.background}」。`,"info");
 render();
}

const EVENT_BANK={
5:[
 {title:"林中獸影",regions:["中州","南疆","北境"],text:"你與童年好友在村外玩耍時，一頭受傷的低階妖獸從灌木中現身。牠已經發現你們。",choices:[
  ["擋在朋友身前","protect"],["拉著朋友一起跑","runTogether"],["自己逃跑","runSolo"],["躲起來觀察","observeBeast"]
 ]},
 {title:"禁忌古井",regions:["中州","南疆","西境"],text:"大人總說村西那口廢井不准靠近。今天朋友卻問你敢不敢去。",choices:[
  ["一起去看看","wellGo"],["不去","wellNo"],["告訴父母","wellTell"],["晚上自己去","wellNight"]
 ]},
 {title:"受傷的小獸",regions:["*"],text:"你在路邊發現一隻受傷的小獸。牠蜷縮著身體，警惕地望著你。",choices:[
  ["帶回家照顧","petSave"],["偷拿家裡的藥救牠","petSteal"],["告訴父母","petTell"],["不理會","petIgnore"]
 ]},
 {title:"海中的光",regions:["東海沿岸"],text:"深夜的海面上突然浮現幽藍色光芒，遠得看不清那究竟是什麼。",choices:[
  ["告訴父母","seaTell"],["和朋友去看","seaFriend"],["自己偷偷去","seaAlone"],["當作看錯","seaIgnore"]
 ]},
 {title:"第一場雪",regions:["北境"],text:"暴雪提前來臨，你和朋友困在村外，回家的路已被風雪遮住。",choices:[
  ["尋找山洞","snowCave"],["繼續趕路","snowRoad"],["抱團取暖等待","snowWait"],["分頭找路","snowSplit"]
 ]}
],
8:[
 {title:"父親病倒了",regions:["*"],text:"家中主要勞力突然病倒，藥錢遠超你們手上的積蓄。",choices:[
  ["上山採藥","herb"],["去找工作","work"],["偷藥","stealMed"],["求掌櫃賒藥","begMed"]
 ]},
 {title:"村中武師",regions:["*"],text:"一名退伍武師開始教附近孩子拳腳。",choices:[
  ["學拳","learnFist"],["學身法","learnMove"],["學弓","learnBow"],["不學","skipMartial"]
 ]},
 {title:"死人留下的書",regions:["*"],text:"你在舊屋角落找到一本殘破的書，封皮已經看不清字。",choices:[
  ["找老師讀","bookTeacher"],["自己研究","bookSelf"],["先收起來","bookKeep"],["賣掉","bookSell"]
 ]}
],
11:[
 {title:"未來的路",regions:["*"],text:"家裡開始認真考慮你將來靠什麼生活。",choices:[
  ["習武","pathMartial"],["讀書","pathStudy"],["學醫","pathMedicine"],["經商","pathTrade"],["狩獵","pathHunt"],["無所事事","pathIdle"]
 ]},
 {title:"朋友的夢想",regions:["*"],text:"童年好友問你：『你長大以後想做什麼？』",choices:[
  ["成為大俠","dreamHero"],["賺很多錢","dreamMoney"],["成家過日子","dreamFamily"],["離開家鄉看看","dreamTravel"],["成為仙人","dreamImmortal"],["我不知道","dreamNone"]
 ]}
],
13:[
 {title:"偷藥的人",regions:["*"],text:"你的朋友偷了一株昂貴藥材，因為他的母親病得很重。",choices:[
  ["替他隱瞞","hideTheft"],["勸他歸還","returnTheft"],["想辦法替他付錢","payTheft"],["告密","reportTheft"],["幫他偷更多","moreTheft"]
 ]},
 {title:"災難",regions:["*"],text:"一場突如其來的災難襲擊了附近村鎮。你只能在有限時間裡做一件事。",choices:[
  ["先救家人","saveFamily"],["先救朋友","saveFriend"],["協助村民","saveVillage"],["保住家裡財物","saveGoods"],["逃離此地","fleeDisaster"]
 ]}
],
15:[
 {title:"受傷修士",regions:["*"],text:"你在荒野發現一名重傷男子，他的劍竟懸浮在半空。這是你第一次如此接近真正的修仙者。",choices:[
  ["救他","saveCultivator"],["搜刮他的東西","lootCultivator"],["回去找人","seekHelpCultivator"],["殺人奪寶","killCultivator"],["立刻離開","leaveCultivator"]
 ]},
 {title:"仙人鬥法",regions:["*"],text:"遠方山谷突然爆出強烈靈光。兩名修士正在鬥法，碎石與火光四散。",choices:[
  ["立刻逃","battleRun"],["遠遠觀看","battleWatch"],["靠近","battleNear"],["等打完再撿東西","battleLoot"]
 ]}
]
};

let currentEvent=null;
function renderAgeEvent(age){
 let pool=EVENT_BANK[age].filter(e=>e.regions.includes("*")||e.regions.includes(G.region));
 currentEvent=pick(pool);
 setScreen(`
 <div class="title">${age}歲 · ${currentEvent.title}</div>
 <div class="subtitle">${G.hometown}</div>
 <p style="font-size:18px;line-height:1.8">${currentEvent.text}</p>
 ${currentEvent.choices.map((c,i)=>`
 <div class="choice">
  <h4>${i+1}. ${c[0]}</h4>
  <button onclick="resolveChoice('${c[1]}')">選擇</button>
 </div>`).join("")}
 `);
}
function resolveChoice(code){
 const f=relation("friend","童年好友");
 const difficult=(base,stat)=>chance(base + G.stats[stat]*0.035 + (G.flags.luck||0)/1000);
 const good=(t)=>addLog(t,"good"), bad=(t)=>addLog(t,"bad");
 switch(code){
  case"protect":
   addTrait("勇敢"); f.aff+=18;f.trust+=22;G.flags.protectedFriend=true;
   if(difficult(.22,"hp")){modStat("hp",1);good(`你擋下妖獸，雖受傷卻成功拖到大人趕來。${f.name}從此牢牢記住這一天。`)}
   else if(chance(.82)){G.flags.scar=true;bad("你被妖獸抓傷，所幸一名獵戶及時趕到。左肩留下永久傷痕。")}
   else {return die("你為保護朋友遭妖獸重創，短短五年的人生就此結束。")}
   break;
  case"runTogether":
   addTrait("謹慎"); if(difficult(.35,"spd")){f.aff+=10;f.trust+=12;good("你們一路狂奔，最後一起逃回村裡。")}else{G.flags.scar=true;bad("逃跑途中你摔傷了腿，所幸兩人都活了下來。")}
   break;
  case"runSolo":
   addTrait("自保"); f.trust-=25; if(chance(.18)){f.alive=false;bad(`${f.name}沒有回來。從此，這個名字成為你童年最沉重的記憶。`)}else bad(`${f.name}活了下來，但看你的眼神已經不一樣。`);
   break;
  case"observeBeast":
   addTrait("好奇");modStat("wis",1);good("你注意到妖獸後腿受傷，利用牠行動不便的弱點找到逃跑路線。");break;
  case"wellGo":addTrait("好奇"); if(chance(.15)){G.flags.ancientWell=true;addLog("你在井壁看到不像凡人留下的古老刻痕。","rare")}else addLog("井裡只有腐水與碎石。");break;
  case"wellNo":addTrait("謹慎");addLog("你拒絕了朋友的提議。那口井暫時與你的人生擦肩而過。");break;
  case"wellTell":f.trust-=3;addLog("大人把那口井重新封了起來。");break;
  case"wellNight":addTrait("冒險"); if(chance(.08)){G.flags.ancientWell=true;addLog("午夜井底傳來一聲極輕的鐘鳴。","rare")}else bad("你跌傷了，偷偷養了好幾天傷。");break;
  case"petSave":G.flags.petSeed=true;addTrait("仁善");good("你把小獸帶回家，牠漸漸不再怕你。");break;
  case"petSteal":G.flags.petSeed=true;G.flags.stoleBefore=true;addTrait("重情");addLog("你偷了家中的藥。小獸活了，但父母發現藥少了。");break;
  case"petTell":addLog("父母接手處理了這隻小獸。");break;
  case"petIgnore":addLog("你轉身離開。幾天後再經過時，小獸已不見蹤影。");break;
  case"seaTell":addLog("父母把你拉回屋裡，告誡你夜裡不要靠近海邊。");break;
  case"seaFriend":addTrait("好奇");G.flags.seaLight=true;addLog("你們走近海邊，遠遠看見一道靈光掠過海面。","rare");break;
  case"seaAlone":addTrait("冒險");G.flags.seaLight=true;if(chance(.12))addLog("你撿到一枚刻著陌生紋路的碎片。","rare");else bad("浪頭把你打翻，差點溺水。");break;
  case"seaIgnore":addLog("你關上窗戶。那抹藍光很快消失。");break;
  case"snowCave":addTrait("謹慎");good("你們找到背風山洞，熬過暴雪。");break;
  case"snowRoad":if(difficult(.28,"hp"))good("你硬撐著走回村裡。");else bad("你凍傷了手指，休養許久。");break;
  case"snowWait":addTrait("沉著");f.trust+=8;good("你們彼此取暖，最後被搜尋的大人找到。");break;
  case"snowSplit":f.trust-=10;if(chance(.12))bad("朋友走失了一整夜，從此很怕雪。");else addLog("你們最後都安全回村。");break;

  case"herb":addSkill("採藥入門");modStat("wis",1);good("你學會辨認幾種常用草藥，也替家裡省下一筆藥錢。");break;
  case"work":addSkill("雜務經驗");modStat("hp",1);addLog("你第一次靠自己的勞力賺到錢。");break;
  case"stealMed":addTrait("重情");G.flags.stoleBefore=true;if(difficult(.35,"spd"))good("你偷到了藥，父親撐過這一關。");else bad("你被抓了，最後仍有人看在你年幼的份上賒藥給你。");break;
  case"begMed":modStat("cha",1);addTrait("懂得求助");addLog("掌櫃沒有白送，而是讓你日後替藥鋪做工還債。");break;
  case"learnFist":addSkill("基礎拳腳");modStat("str",1);break;
  case"learnMove":addSkill("基礎身法");modStat("spd",1);break;
  case"learnBow":addSkill("基礎弓術");modStat("str",1);break;
  case"skipMartial":addTrait("隨性");break;
  case"bookTeacher":addSkill("識文斷字");modStat("wis",1);addLog("老師告訴你，那只是一本普通醫書，但你因此開始識字。");break;
  case"bookSelf":if(G.skills.includes("識文斷字")||G.stats.wis>=7){addSkill("殘卷研究");G.flags.oldBook=true;addLog("書中夾著一頁看不懂的呼吸法。","rare")}else addLog("你盯了半天，還是看不懂。");break;
  case"bookKeep":G.flags.oldBook=true;addLog("你把破書藏在箱底。");break;
  case"bookSell":addLog("你把書換成了幾頓熱飯。");break;

  case"pathMartial":addSkill("凡俗武藝");modStat("str",1);modStat("hp",1);break;
  case"pathStudy":addSkill("識文斷字");modStat("wis",1);break;
  case"pathMedicine":addSkill("藥理入門");modStat("wis",1);break;
  case"pathTrade":addSkill("商道入門");modStat("cha",1);break;
  case"pathHunt":addSkill("野外生存");modStat("spd",1);break;
  case"pathIdle":addTrait("隨性");if(chance(.12)){G.flags.fortuneSeed=true;addLog("你在河灘撿到一枚漆黑指環，怎麼洗都洗不亮。","rare")}break;
  case"dreamHero":G.flags.dream="大俠";addTrait("俠氣");break;
  case"dreamMoney":G.flags.dream="富足";break;
  case"dreamFamily":G.flags.dream="成家";break;
  case"dreamTravel":G.flags.dream="遊歷";addTrait("好奇");break;
  case"dreamImmortal":G.flags.dream="求仙";addTrait("求仙之心");break;
  case"dreamNone":G.flags.dream="未定";break;

  case"hideTheft":addTrait("重情");G.rep.righteous-=1;f.trust+=10;break;
  case"returnTheft":addTrait("守序");G.rep.righteous+=2;f.trust-=3;break;
  case"payTheft":addTrait("仁善");G.rep.righteous+=3;f.aff+=8;break;
  case"reportTheft":addTrait("守規");G.rep.righteous+=2;f.trust-=20;break;
  case"moreTheft":addTrait("狡黠");G.rep.demonic+=2;G.flags.stoleBefore=true;f.trust+=5;break;
  case"saveFamily":addTrait("重情");break;
  case"saveFriend":addTrait("重情");f.trust+=12;break;
  case"saveVillage":addTrait("仁善");G.rep.world+=2;modStat("hp",1);break;
  case"saveGoods":addTrait("務實");break;
  case"fleeDisaster":addTrait("自保");break;

  case"saveCultivator":
    G.flags.cultivatorFavor=true;G.rep.righteous+=1;
    if(chance(.25))G.flags.wanderingMaster=true;
    addLog("你冒險替修士止血。他離開前只留下一句：『若有仙緣，日後自會再見。』","rare");break;
  case"lootCultivator":G.flags.lootSeed=true;G.rep.demonic+=1;addLog("你拿走了一只小袋子，卻怎麼都打不開。");break;
  case"seekHelpCultivator":G.rep.righteous+=1;addLog("你帶來村中長輩，再回來時，那名修士已經不見了。");break;
  case"killCultivator":
    if(G.stats.str+G.stats.spd>=14 && chance(.35)){G.flags.killedCultivator=true;G.rep.demonic+=8;addLog("你真的下了手。這是你第一次殺死一名修士。","bad")}
    else {return die("重傷修士在最後一刻睜眼。一道劍光，結束了你十五年的人生。")}
    break;
  case"leaveCultivator":addLog("你沒有介入。第二天再去，那裡只剩乾涸血跡。");break;
  case"battleRun":addTrait("謹慎");break;
  case"battleWatch":modStat("wis",1);addLog("你第一次真正看見術法與飛劍的威力。");break;
  case"battleNear":if(chance(.25))addLog("你在亂石間撿到一張燒焦的符籙殘片。","rare");else bad("一道餘波將你掀飛，幸好只是重傷。");break;
  case"battleLoot":
    if(chance(.22)){G.flags.lootSeed=true;addLog("你在戰後撿到一枚下品靈石。這是你人生第一塊靈石。","rare")}
    else bad("你什麼也沒撿到，還差點撞見返回現場的修士。");
    break;
 }
 advanceAge();
}
function advanceAge(){
 const next={5:8,8:11,11:13,13:15,15:16}[G.age];
 if(next===16){G.age=16;G.year=758;G.phase="test16"} else {G.year+=next-G.age;G.age=next;G.phase="age"+next}
 render();
}

function renderTest16(){
 const f=relation("friend","童年好友");
 const npcRoot = f.alive ? pick(["無靈根","水真靈根","火木雙靈根","金土雙靈根","三靈根","四靈根"]) : "—";
 G.flags.friendRoot=npcRoot;
 const desc=rootType();
 setScreen(`
 <div class="title">16歲 · 測靈大典</div>
 <div class="subtitle">你第一次真正站在修仙界門前。</div>
 <p>測靈石在你的掌心逐一亮起：</p>
 <h2 style="font-size:32px">${G.roots.join(" · ")}</h2>
 <p>執事沉吟片刻，朗聲宣布：<b>${desc}</b>。</p>
 ${f.alive?`<div class="choice"><h4>${f.name}的測靈結果</h4><p>${npcRoot}</p></div>`:""}
 <button class="primary" onclick="calculateOffers()">查看宗門招募結果</button>
 `);
}
function calculateOffers(){
 let offers=[];
 const r=G.roots, s=G.stats;
 function push(name,rank,reason){offers.push({name,rank,reason})}
 if(r.includes("金") && (s.wis>=6||s.spd>=6)) push("太虛劍宗",r.length<=2?"內門弟子":"外門弟子","金靈根與劍修適性不錯");
 if((r.includes("木")||r.includes("水")||r.includes("火")) && (s.wis>=6||G.skills.includes("藥理入門")||G.skills.includes("採藥入門"))) push("藥王谷",r.length<=2&&s.wis>=7?"內門弟子":"外門弟子","醫藥與靈根契合");
 if((r.includes("火")||r.includes("土")||r.includes("金")) && (s.qi>=6||s.wis>=7)) push("神策府",r.length<=2?"內門候補":"外門弟子","氣根／悟性符合要求");
 if((r.includes("土")||r.includes("金")) && (s.hp>=6||s.str>=6)) push("梵天禪院",s.hp>=7?"內門弟子":"外門弟子","肉身根基受禪院看重");
 if(G.flags.wanderingMaster) push("散修韓九山","親授弟子","十五歲時結下仙緣");
 if(G.rep.demonic>=3||G.flags.killedCultivator) push("天魔教","魔徒","有人暗中注意到了你");
 if(G.roots.length===5 && G.flags.fortuneSeed) push("？？？","未知傳承","黑色指環在測靈時第一次發熱");
 offers.push({name:"散修",rank:"自由身",reason:"拒絕宗門，自尋仙路"});
 offers.push({name:"返回故鄉",rank:"凡人",reason:"你沒有義務踏入仙途"});
 G.offers=offers;G.phase="route";addLog(`完成測靈：${rootType()}。`,"info");render();
}
function renderRoute(){
 setScreen(`
 <div class="title">仙途分流</div>
 <div class="subtitle">你的過去決定了哪些門向你打開，但最後走哪條路由你決定。</div>
 ${G.offers.map((o,i)=>`
  <div class="choice">
   <h4>${o.name} · ${o.rank}</h4>
   <p>${o.reason}</p>
   <button onclick="chooseRoute(${i})">選擇此路</button>
  </div>`).join("")}
 `);
}
function chooseRoute(i){
 const o=G.offers[i];G.flags.route=o.name;
 if(o.name==="返回故鄉"){G.currentPlace=G.hometown;G.realm="凡人";addLog("你拒絕仙途，返回故鄉。世界仍會繼續前進。");}
 else {G.currentPlace=o.name;G.realm="煉氣一層";G.cultivation=5;addLog(`你選擇「${o.name}」，以「${o.rank}」身分踏入修仙界。`,"good");}
 G.phase="cultivation";render();
}
function renderCultivation(){
 const isMortal=G.realm==="凡人";
 setScreen(`
 <div class="title">修仙篇 · 初入仙途</div>
 <div class="subtitle">${G.currentPlace}</div>
 <div class="choice">
  <h4>當前境界：${G.realm}</h4>
  <p>修為進度：${G.cultivation}/100</p>
  <div class="progress"><span style="width:${Math.min(100,G.cultivation)}%"></span></div>
 </div>
 ${isMortal?`
  <p>你選擇了凡人的生活。但命運並沒有保證仙緣永遠不會再次找上門。</p>
  <button onclick="passYearMortal()">度過一年</button>
 `:`
  <div class="row">
   <button class="primary" onclick="cultivate(0.25)">閉關三個月</button>
   <button onclick="cultivate(1)">閉關一年</button>
   <button onclick="mission()">接取任務</button>
  </div>
 `}
 <div style="margin-top:16px" class="notice">Alpha 0.1 的可玩範圍目前到「煉氣初期」。閉關會讓世界與NPC同步推進。</div>
 `);
}
function cultivate(years){
 const months=Math.round(years*12);
 const gain=Math.max(3,Math.round((G.stats.qi+G.stats.wis/2)*(G.roots.length===1?1.35:G.roots.length===2?1.15:G.roots.length===3?1:0.82)*years*3));
 G.cultivation+=gain;
 G.year+=years;G.age+=years;
 worldTick(years);
 addLog(`閉關${months}個月，修為增加 ${gain}。`);
 while(G.cultivation>=100){
  G.cultivation-=100;
  const m=G.realm.match(/煉氣([一二三四五六七八九])層/);
  const arr=["一","二","三","四","五","六","七","八","九"];
  if(m){
   let idx=arr.indexOf(m[1]);
   if(idx<8){G.realm=`煉氣${arr[idx+1]}層`;addLog(`突破至${G.realm}！`,"good")}
   else {G.realm="煉氣大圓滿";G.cultivation=100;addLog("你抵達煉氣大圓滿。築基之路尚未在本 Alpha 開放。","rare");break}
  }
 }
 render();
}
function mission(){
 const list=["護送商隊","採集靈草","清剿低階妖獸","送信至鄰城","宗門雜務"];
 const q=pick(list); const ok=chance(.55+(G.stats.hp+G.stats.spd+G.stats.wis)/100);
 G.year+=0.08;G.age+=0.08;worldTick(.08);
 if(ok){G.cultivation+=rand(5)+3;G.rep.world+=1;addLog(`完成任務「${q}」，得到一些修煉資源。`,"good")}
 else addLog(`任務「${q}」進行得不順利，你受了些挫折。`,"bad");
 render();
}
function worldTick(years){
 const f=relation("friend","童年好友");
 if(f.alive && chance(Math.min(.7,years*.18))){
  const happenings=["修為有所精進","離開故鄉遠行","結識了一位新朋友","拜入一位前輩門下","在一次歷練中受傷"];
  addLog(`【故人消息】${f.name}${pick(happenings)}。`,"info");
 }
 if(chance(Math.min(.8,years*.25))){
  addLog(`【天下大事】${pick(["鎮妖關附近妖獸活動增加","天元城即將舉行拍賣會","北境傳出劍修天才崛起","南疆發現新的靈藥產地","正魔兩道關係逐漸緊張"])}。`,"info");
 }
}
function passYearMortal(){
 G.year+=1;G.age+=1;
 if(chance(.15) && G.age<35){addLog("一名路過的修士在村中短暫停留。也許仙緣並未完全離開。","rare")}
 else addLog("你在凡塵中又度過了一年。");
 render();
}
function die(msg){G.alive=false;addLog(msg,"bad");render()}
function renderDeath(){
 setScreen(`<div class="title">人物生平</div><p style="font-size:19px;line-height:1.8">${G.name}，生於大曆742年，卒於大曆${Math.floor(G.year)}年，享年${Math.floor(G.age)}歲。</p><p>${G.events.map(e=>e.text).reverse().slice(0,8).join("；")}。</p><button class="primary" onclick="newGame()">開始下一世</button>`);
}
function saveGame(){localStorage.setItem("dahuang_save",JSON.stringify(G));addLog("遊戲已儲存。","info")}
function loadGame(){const s=localStorage.getItem("dahuang_save");if(!s)return alert("尚無存檔。");G=JSON.parse(s);render()}
function newGame(){if(confirm("確定開始新局？未儲存進度會消失。")){G=freshState();render()}}
G=freshState();render();
</script>
</body>
</html>
